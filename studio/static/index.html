<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CoreAlign Studio</title>
<!--
  CoreAlign Studio.

  One screen, five stages, one question per stage. Everything is drawn from Studio's own
  API (/api/status, /api/review, /api/arrange, /api/results); the page does not embed REPORT.html and
  never sees the bridge token.

  Layout patterns taken from shipped products, via Mobbin:
    Reddit mod queue     queue on the left, the item and its two decisions on the right
    ClassDojo review     media on a dark stage, the decision rail beside it
    Databricks pipeline  run header with state and duration, event log in a drawer
    Vanta tests          verdict cards above a severity queue
    Supabase advisor     worst severity first with a count on every group
    Graphite inbox       collapsible groups that skip quiet items on arrival
    Linear inbox         one clearly scoped bulk action
    AWS upload status    a summary strip of counts above the detail
    Zoho CRM migration   numbered stage tracker across the top

  Icons are Remixicon (Apache-2.0), inlined so the page needs no network.
-->
<style>
:root{
  --bg:#f7f7f5; --surface:#ffffff; --surface-2:#f2f2f0; --sunk:#ebebe8;
  --text:#191919; --muted:#626260; --faint:#8a8a86;
  --line:#e3e2df; --line-strong:#c9c8c4;
  --accent:#2383e2; --accent-dark:#1f6fbd; --accent-soft:#eaf3fb; --on-accent:#ffffff;
  --ok:#0f7b6c; --ok-soft:#e7f3f1;
  --warn:#a66b00; --warn-soft:#fff1c7;
  --bad:#d44c47; --bad-soft:#fdebec;
  --none:#8a8a86; --none-soft:#eeeeec;
  --stage-bg:#0d0d0f;
  --grid-present:#00a8a3; --grid-ghost:#a4a4a0; --grid-edited:#31a85d;
  --grid-selected:#d99a12; --grid-label:#ffffff; --grid-handle-fill:#0d0d0f;
  /* One stack for the page and for the labels burned into an exported figure. It has to
     start with the platform's own UI face, because that is the only one guaranteed to be
     installed and the only one that carries Thai and Latin with matching metrics. A bare
     "sans-serif" resolves to Helvetica on macOS, which has no Thai at all and drew every
     Thai label in the exported PNG as empty boxes. */
  --font-ui:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","IBM Plex Sans Thai",
    "Noto Sans Thai","Sarabun",Roboto,"Helvetica Neue",sans-serif;
  --radius-lg:16px;
  --shadow:0 1px 2px rgba(15,15,15,.06); --shadow-lg:0 8px 28px rgba(15,15,15,.14);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141416; --surface:#1c1c1f; --surface-2:#232327; --sunk:#0f0f11;
    --text:#f4f3f1; --muted:#b6b5b1; --faint:#8b8a87;
    --line:#33333a; --line-strong:#4b4b53;
    --accent:#4f9dea; --accent-dark:#7bb7f0; --accent-soft:#14283d; --on-accent:#08121c;
    --ok:#3fbfa8; --ok-soft:#0e2b28;
    --warn:#e0a63a; --warn-soft:#33280f;
    --bad:#ef6b66; --bad-soft:#361a1a;
    --none:#7c7b78; --none-soft:#26262a;
    --stage-bg:#08080a;
    --grid-present:#00ebe6; --grid-ghost:#aaa9a5; --grid-edited:#50f07d;
    --grid-selected:#ffd166; --grid-label:#ffffff; --grid-handle-fill:#08080a;
    --shadow:0 1px 2px rgba(0,0,0,.5); --shadow-lg:0 10px 34px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141416; --surface:#1c1c1f; --surface-2:#232327; --sunk:#0f0f11;
  --text:#f4f3f1; --muted:#b6b5b1; --faint:#8b8a87;
  --line:#33333a; --line-strong:#4b4b53;
  --accent:#4f9dea; --accent-dark:#7bb7f0; --accent-soft:#14283d; --on-accent:#08121c;
  --ok:#3fbfa8; --ok-soft:#0e2b28;
  --warn:#e0a63a; --warn-soft:#33280f;
  --bad:#ef6b66; --bad-soft:#361a1a;
  --none:#7c7b78; --none-soft:#26262a;
  --stage-bg:#08080a;
  --grid-present:#00ebe6; --grid-ghost:#aaa9a5; --grid-edited:#50f07d;
  --grid-selected:#ffd166; --grid-label:#ffffff; --grid-handle-fill:#08080a;
  --shadow:0 1px 2px rgba(0,0,0,.5); --shadow-lg:0 10px 34px rgba(0,0,0,.6);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--font-ui);
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg{display:block;fill:currentColor}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em}

/* ---------------------------------------------------------------- app shell */
.app{display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;height:100dvh}

.topbar{
  position:relative;z-index:20;display:grid;
  grid-template-columns:minmax(250px,1fr) minmax(470px,auto) minmax(350px,1fr);
  align-items:center;gap:12px;padding:7px 14px;min-height:62px;
  background:var(--surface);border-bottom:1px solid var(--line);
}
.topbarLeft,.topbarRight{display:flex;align-items:center;gap:10px;min-width:0}
.topbarRight{justify-content:flex-end}
.topbarCenter{min-width:0}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.brand .mark{
  width:28px;height:28px;flex:0 0 auto;border-radius:9px;
  display:grid;place-items:center;background:var(--accent);color:var(--on-accent);
}
.topbar .slideName{
  min-width:0;flex:1 1 auto;color:var(--muted);font-size:13.5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.fileMenuHost{position:relative;flex:0 0 auto}
.menuButton{min-height:34px;padding:0 11px;border-color:transparent}
.fileMenu{
  position:absolute;top:calc(100% + 7px);left:0;width:min(360px,calc(100vw - 28px));
  padding:7px;border:1px solid var(--line);border-radius:12px;background:var(--surface);
  box-shadow:var(--shadow-lg);z-index:40
}
.fileMenuItem{
  display:grid;grid-template-columns:20px minmax(0,1fr);column-gap:9px;width:100%;
  padding:9px 10px;border-radius:8px;text-align:left;color:var(--text)
}
.fileMenuItem:hover:not(:disabled){background:var(--surface-2)}
.fileMenuItem:disabled{cursor:default;color:var(--faint)}
.fileMenuItem svg{grid-row:1/3;margin-top:2px}
.fileMenuItem .itemLabel{font-size:13.5px;font-weight:750}
.fileMenuItem .itemReason{font-size:11.5px;line-height:1.35;color:var(--faint)}
.fileMenuPath{display:grid;gap:8px;margin:4px 7px 8px;padding:10px;border-radius:9px;background:var(--surface-2)}
.fileMenuPath code{overflow-wrap:anywhere;color:var(--text)}
.fileMenuPath p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}
.fileMenuPath .btn{justify-self:start;min-height:32px;padding:0 10px;font-size:12px}
.pill{
  display:inline-flex;align-items:center;gap:7px;flex:0 0 auto;
  padding:5px 12px 5px 10px;border-radius:999px;
  font-size:13px;font-weight:700;white-space:nowrap;
  background:var(--none-soft);color:var(--muted);
}
.pill .dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:0 0 auto}
.pill[data-tone="run"]{background:var(--accent-soft);color:var(--accent-dark)}
.pill[data-tone="run"] .dot{animation:breathe 1.6s ease-in-out infinite}
.pill[data-tone="wait"]{background:var(--warn-soft);color:var(--warn)}
.pill[data-tone="ok"]{background:var(--ok-soft);color:var(--ok)}
.pill[data-tone="bad"]{background:var(--bad-soft);color:var(--bad)}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.25}}
.clock{font-variant-numeric:tabular-nums;color:var(--faint);font-size:13px;flex:0 0 auto}
.iconBtn{
  width:34px;height:34px;flex:0 0 auto;border-radius:9px;display:grid;place-items:center;
  color:var(--muted);
}
.iconBtn:hover{background:var(--surface-2);color:var(--text)}
.langBtn{width:auto;min-width:34px;padding:0 8px;font-size:12.5px;font-weight:800}
.topbarExport{min-height:36px;padding:0 15px}

/* stage tracker */
.stages{
  display:flex;align-items:stretch;gap:2px;
  padding:0;background:var(--surface);
  overflow-x:auto;scrollbar-width:none;
}
.stages::-webkit-scrollbar{display:none}
.stageTab{
  display:flex;align-items:center;gap:7px;padding:6px 9px 6px 6px;border-radius:999px;
  color:var(--faint);font-size:12.5px;font-weight:650;white-space:nowrap;
}
.stageTab .num{
  width:22px;height:22px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;
  border:1.5px solid currentColor;font-size:11.5px;font-weight:800;
}
.stageTab[data-state="done"]{color:var(--ok)}
.stageTab[data-state="done"] .num{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.stageTab[data-state="now"]{color:var(--accent-dark);background:var(--accent-soft)}
.stageTab[data-state="now"] .num{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.stageTab:disabled{cursor:default}
.stageTab:not(:disabled):hover{background:var(--surface-2)}
.stageSep{align-self:center;width:8px;height:1px;background:var(--line-strong);flex:0 0 auto}

.stageBody{min-height:0;position:relative;overflow:hidden}
.panel{position:absolute;inset:0;display:none;min-height:0}
.panel.is-active{display:grid}

/* ---------------------------------------------------------------- generic bits */
.center{place-items:center;overflow-y:auto;padding:32px 24px}
.card{
  width:100%;max-width:720px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:26px;
}
/* On a 720 px laptop this card runs past the fold as soon as a prior-run banner appears,
   and the one button the screen exists for goes with it. Same shape as the results dialog:
   the questions scroll, the action row does not. */
.tissuePanel .card{
  display:flex;flex-direction:column;max-height:calc(100dvh - 150px);padding-bottom:0;
}
.tissuePanel .cardBody{
  display:grid;gap:18px;align-content:start;min-height:0;overflow-y:auto;
  margin:0 -26px;padding:0 26px 4px;
}
.tissuePanel .card > .controlsRow{
  flex:0 0 auto;margin-top:16px;padding:14px 0 26px;border-top:1px solid var(--line);
}
h1,h2{margin:0;letter-spacing:-.015em}
h1{font-size:23px;font-weight:800}
h2{font-size:17px;font-weight:750}
.lede{margin:6px 0 0;color:var(--muted);font-size:14px}
.rowGap{display:grid;gap:18px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:42px;padding:0 20px;border-radius:10px;
  font-size:14.5px;font-weight:750;white-space:nowrap;
  border:1px solid var(--line-strong);background:var(--surface);color:var(--text);
  transition:background 140ms ease,border-color 140ms ease,transform 90ms ease;
}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.42;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover:not(:disabled){background:var(--accent-dark);border-color:var(--accent-dark)}
.btn.big{min-height:48px;padding:0 26px;font-size:15.5px}
.btn.quiet{border-color:transparent;color:var(--muted)}
.btn.quiet:hover:not(:disabled){background:var(--surface-2);color:var(--text)}
.btn.danger{color:var(--bad)}

/* segmented choice: two options on one line, nothing to open */
.choice{display:grid;gap:9px}
.choice > .label{font-size:13px;font-weight:750;color:var(--muted)}
.segmented{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.segmented button{
  text-align:left;padding:13px 15px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--surface);
  transition:border-color 140ms ease,background 140ms ease;
}
.segmented button:hover{border-color:var(--line-strong)}
.segmented button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.segmented .t{display:block;font-weight:750;font-size:14.5px}
.segmented .d{display:block;margin-top:2px;color:var(--muted);font-size:12.5px;line-height:1.45}
.priorRun{
  display:flex;align-items:center;gap:14px;padding:13px 15px;border-radius:12px;
  background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 28%,transparent);
}
.priorRun[hidden]{display:none}
.priorRun.warn{
  background:var(--warn-soft);color:var(--warn);
  border-color:color-mix(in srgb,var(--warn) 34%,transparent);
}
.priorRun.warn .txt span{color:inherit;opacity:.85}
.priorRun .txt{flex:1 1 auto;min-width:0}
.priorRun .txt b{display:block;font-size:14px;font-weight:750}
.priorRun .txt span{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}

/* ---------------------------------------------------------------- slide picker */
.picker{grid-template-rows:auto minmax(0,1fr)}
.pickerHead{padding:18px 22px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--muted)}
.crumbs button{padding:3px 9px;border-radius:7px;background:var(--surface-2);font-size:12.5px;font-weight:650}
.crumbs button:hover{background:var(--sunk)}
.crumbs .where{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickerBody{overflow-y:auto;padding:14px 22px 26px}
.fileList{display:grid;gap:6px;max-width:920px}
.fileRow{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:11px 14px;border-radius:11px;border:1px solid transparent;background:var(--surface);
}
.fileRow:hover:not([disabled]){border-color:var(--line);background:var(--surface-2)}
.fileRow .ico{color:var(--faint);flex:0 0 auto}
.fileRow .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:650}
.fileRow .meta{color:var(--faint);font-size:12.5px;flex:0 0 auto;font-variant-numeric:tabular-nums}
.fileRow.slide .ico{color:var(--accent)}
.fileRow[disabled]{opacity:.45;cursor:default}
.emptyNote{padding:26px 4px;color:var(--muted);font-size:14px}

/* ---------------------------------------------------------------- running */
.stageRunView{width:100%;height:100%;place-items:center;padding:28px}
.stageRunView:not([hidden]){display:grid}
.runCard{width:100%;max-width:660px;text-align:center}
.bar{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden;margin:20px 0 10px}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width 400ms ease}
.bar.indeterminate > i{width:36%;animation:slide 1.5s ease-in-out infinite}
@keyframes slide{0%{margin-left:-36%}100%{margin-left:100%}}
.runStep{color:var(--muted);font-size:14px;min-height:22px;word-break:break-word}
.runCounts{display:flex;justify-content:center;gap:26px;margin-top:18px;font-variant-numeric:tabular-nums}
.runCounts div{text-align:center}
.runCounts b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em}
.runCounts span{font-size:12px;color:var(--faint)}
.activity{
  list-style:none;margin:22px auto 0;padding:14px 18px;max-width:560px;
  text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--surface);
  display:grid;gap:7px;
}
.activity:empty{display:none}
.activity li{
  display:flex;gap:9px;align-items:baseline;font-size:13px;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.activity li::before{
  content:"";width:6px;height:6px;flex:0 0 auto;border-radius:50%;background:var(--line-strong);
}
.activity li:last-child{color:var(--text);font-weight:650}
.activity li:last-child::before{background:var(--accent)}

/* ---------------------------------------------------------------- metric strip */
.strip{display:flex;gap:9px;flex-wrap:wrap}
.metric{
  flex:1 1 118px;min-width:112px;padding:11px 14px;border-radius:12px;
  background:var(--surface-2);border:1px solid var(--line);
}
.metric b{display:block;font-size:21px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.metric span{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.metric[data-tone="ok"] b{color:var(--ok)} .metric[data-tone="warn"] b{color:var(--warn)}
.metric[data-tone="none"] b{color:var(--none)} .metric[data-tone="bad"] b{color:var(--bad)}

/* ---------------------------------------------------------------- grid gate */
.stageEditor{width:100%;height:100%;min-width:0;min-height:0}
.gridGate{display:grid;grid-template-columns:minmax(0,1fr) 340px}
.gridStage{
  background:var(--stage-bg);display:flex;align-items:center;justify-content:center;
  min-height:0;min-width:0;overflow:auto;padding:18px;border-right:1px solid var(--line);
}
/* The canvas is sized in script, not by percentages. A percentage max-height needs a
   definite height to resolve against, and neither the flex line nor this wrapper has one,
   which is how a 1055x2048 overlay ended up rendering at full size inside a 310px box. */
/* The image carries the size and the wrapper follows it. Sizing the wrapper instead made
   the image 100% of a box that was itself sized by the image, which collapses to nothing. */
.gridWorkspace{display:grid;justify-items:center;gap:12px;flex:0 0 auto;min-width:max-content}
.gridCanvas{position:relative;display:inline-block;line-height:0}
.gridStage img{display:block;max-width:none;max-height:none;border-radius:8px}
.gridStage[data-zoom="true"]{align-items:flex-start;justify-content:flex-start}
.gridOverlay{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.gridOverlay .coreCircle{
  fill:transparent;stroke-width:2;cursor:grab;
  transition:stroke-width 120ms ease,fill 120ms ease;
}
.gridOverlay .coreCircle:hover{fill:color-mix(in srgb,var(--grid-label) 10%,transparent);stroke-width:3}
.gridOverlay .coreCircle[data-state="present"]{stroke:var(--grid-present)}
.gridOverlay .coreCircle[data-state="ghost"]{stroke:var(--grid-ghost);stroke-dasharray:6 5;fill:color-mix(in srgb,var(--grid-ghost) 8%,transparent)}
.gridOverlay .coreCircle[data-state="present"][data-edited="true"]{stroke:var(--grid-edited);stroke-width:3;fill:color-mix(in srgb,var(--grid-edited) 13%,transparent)}
.gridOverlay .coreCircle[data-state="ghost"][data-edited="true"]{fill:color-mix(in srgb,var(--grid-edited) 11%,transparent)}
.gridOverlay .coreCircle[data-picked="true"]{stroke:var(--grid-selected);stroke-width:4;fill:color-mix(in srgb,var(--grid-selected) 16%,transparent)}
.gridOverlay .coreCircle.dragging{cursor:grabbing}
.gridOverlay .coreLabel{fill:var(--grid-label);font-weight:800;paint-order:stroke;stroke:var(--stage-bg);stroke-width:2px;stroke-linejoin:round;pointer-events:none}
.gridOverlay .coreLabel[data-state="ghost"]{fill:var(--grid-ghost)}
.gridOverlay .coreLabel[data-picked="true"]{fill:var(--grid-selected)}
.gridOverlay .resizeHandle{fill:var(--grid-handle-fill);stroke:var(--grid-selected);stroke-width:2;vector-effect:non-scaling-stroke}
.gridOverlay .resizeHandle[data-direction="n"],.gridOverlay .resizeHandle[data-direction="s"]{cursor:ns-resize}
.gridOverlay .resizeHandle[data-direction="e"],.gridOverlay .resizeHandle[data-direction="w"]{cursor:ew-resize}
/* ---------------------------------------------------------------- step 4 card grid */
/* min-width:0 on every level. A grid or flex child defaults to min-width:auto, so the
   filter row's max-content width propagated all the way out and made the whole page scroll
   sideways at 375 px. */
.coreGridView{display:none;min-width:0;min-height:0;grid-template-rows:auto minmax(0,1fr);gap:12px;padding:16px 20px 20px}
.panel[data-panel="orientation"].is-active .coreGridView:not([hidden]){display:grid}
.coreGridHead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;min-width:0}
.coreGridFilters{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.filterChip{
  display:inline-flex;align-items:center;gap:7px;min-height:30px;padding:0 11px;
  border:1px solid var(--line);border-radius:999px;background:var(--surface);
  color:var(--muted);font:inherit;font-size:12.5px;font-weight:650;cursor:pointer;
}
.filterChip:hover{border-color:var(--muted)}
.filterChip[aria-pressed="true"]{border-color:var(--accent);color:var(--text);background:var(--surface-2)}
.filterChip .severityDot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.filterChip .n{font-variant-numeric:tabular-nums;color:var(--faint)}
.filterChip[aria-pressed="true"] .n{color:var(--accent)}
.coreGridCount{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.densityControl{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.densityBtn{
  min-width:30px;min-height:30px;border:0;background:var(--surface);color:var(--muted);
  font:inherit;font-size:12px;font-weight:700;cursor:pointer;
}
.densityBtn + .densityBtn{border-left:1px solid var(--line)}
.densityBtn[aria-pressed="true"]{background:var(--surface-2);color:var(--text)}
.coreCards{
  --cardMin:190px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cardMin),1fr));
  /* max-content rows, and start-aligned items. A scroll container with a definite height
     otherwise shares that height between the rows, and every card is squashed to a quarter
     of it while its own contents overflow behind overflow:hidden. */
  grid-auto-rows:max-content;align-items:start;min-width:0;
  gap:12px;overflow:auto;align-content:start;padding-bottom:4px;
}
.coreCards[data-density="s"]{--cardMin:132px}
.coreCards[data-density="l"]{--cardMin:262px}
.coreCard{
  display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;overflow:hidden;position:relative;
}
.coreCard[data-selected="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.coreCard .shot{
  /* flex:0 0 auto, not the 0 1 auto default. A flex item may shrink below the height its
     aspect-ratio asks for, and the square thumbnail collapsed to a 38 px letterbox. */
  position:relative;display:block;width:100%;flex:0 0 auto;padding:0;border:0;
  background:var(--stage-bg);aspect-ratio:1/1;cursor:zoom-in;overflow:hidden;
}
.coreCard .shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.coreCard .shot .noShot{
  position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-size:11.5px;
}
.coreCard .band{
  position:absolute;left:7px;top:7px;display:inline-flex;align-items:center;gap:5px;
  padding:2px 7px;border-radius:999px;background:var(--surface);border:1px solid var(--line);
  font-size:10.5px;font-weight:700;color:var(--text);
}
.coreCard .band .severityDot{width:7px;height:7px;border-radius:50%}
.coreCard .doneMark{
  position:absolute;right:7px;top:7px;width:21px;height:21px;border-radius:50%;
  display:grid;place-items:center;background:var(--ok);color:var(--on-accent);
}
.coreCard[data-checked="false"] .doneMark{display:none}
.coreCard .foot{display:flex;align-items:center;gap:8px;padding:8px 9px;border-top:1px solid var(--line)}
.coreCard .foot > input{flex:0 0 auto;margin:0}
.coreCard .who{flex:1 1 auto;min-width:0;overflow:hidden}
.coreCard .nm{font-size:13px;font-weight:750;letter-spacing:-.01em}
.coreCard .sub{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.coreCard .cardBtn{flex:0 0 auto}
.coreCard .edited{font-size:10px;font-weight:700;color:var(--accent)}
.coreCard .cardBtn{
  min-width:28px;min-height:28px;display:grid;place-items:center;padding:0 6px;
  border:1px solid var(--line);border-radius:7px;background:var(--surface);
  color:var(--muted);font:inherit;font-size:11px;font-weight:700;cursor:pointer;
}
.coreCard .cardBtn:hover{border-color:var(--muted);color:var(--text)}
.coreCards[data-density="s"] .coreCard .sub,
.coreCards[data-density="s"] .coreCard .cardBtn.flip{display:none}
.coreGridEmpty{padding:26px 4px;color:var(--muted);font-size:14px}
.selectionBar{
  position:sticky;bottom:0;display:flex;align-items:center;gap:9px;
  padding:9px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface);box-shadow:0 -6px 20px -14px rgba(0,0,0,.5);
}
.selectionBar[hidden]{display:none}
.selectionBar b{font-size:13px}
.backToGrid{flex:0 0 auto;min-height:30px;padding:0 9px;font-size:12.5px}
@media (max-width:640px){
  /* Nine controls do not fit one phone-width row, and crowding them made the wordmark and
     the run state overlap. Keep the mark, the File menu, the save state and Export: the
     slide name is on the stage below, and the clock is not something anybody acts on. */
  .brand{width:28px;gap:0;overflow:hidden;white-space:nowrap}
  .topbar .slideName,.topbar .clock{display:none}
  .topbar .pill span{display:none}
  .topbar .pill{padding:0 7px}

  .coreGridView{padding:12px 14px 14px}
  .coreGridFilters{flex:1 1 100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}
  .coreGridFilters .filterChip{flex:0 0 auto}
  .coreGridHead .densityControl{order:3}
}
.gridToolShelf{display:grid;justify-items:center;gap:5px;line-height:1.35}
.gridTools{
  display:flex;align-items:center;gap:3px;padding:5px;border-radius:999px;
  border:1px solid var(--line-strong);background:var(--surface);color:var(--text);
  box-shadow:var(--shadow-lg)
}
.gridTool{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 10px;border-radius:999px;color:var(--muted);font-size:12px;font-weight:750;white-space:nowrap}
.gridTool:hover:not(:disabled){background:var(--surface-2);color:var(--text)}
.gridTool[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-dark)}
.gridTool:disabled{opacity:.4;cursor:default}
.gridTool kbd{padding:0 4px;margin:0;font-size:9px}
.gridToolSep{width:1px;height:22px;margin:0 3px;background:var(--line-strong)}
.gridToolReason{min-height:16px;color:var(--grid-label);font-size:11.5px;font-weight:650;white-space:nowrap}

.picked{
  padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);
  display:grid;gap:10px;
}
.picked[hidden]{display:none}
.pickedHead b{display:block;font-size:16px;font-weight:800;letter-spacing:-.01em}
.pickedHead span{display:block;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;margin-top:1px}
.diameterControl{display:grid;gap:5px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.diameterControl > span{font-size:12px;font-weight:750;color:var(--muted)}
.diameterBox{display:flex;align-items:center;gap:5px}
.diameterBox input{width:100%;min-width:0;border:0;background:transparent;font-weight:750;font-variant-numeric:tabular-nums}
.diameterBox output{min-width:24px;color:var(--muted);font-size:12px;font-weight:750}
.diameterRange{color:var(--faint);font-size:11px;line-height:1.35}
.pickedActions{display:grid;gap:6px}
.pickedActions .btn{min-height:38px;font-size:13.5px}
.pickedHint{margin:0;color:var(--faint);font-size:12px}
.sideRail{overflow-y:auto;padding:22px 20px;background:var(--surface);display:grid;gap:18px;align-content:start}
.warnList{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.warnList li{
  display:flex;gap:9px;padding:10px 12px;border-radius:10px;
  background:var(--warn-soft);color:var(--warn);font-size:13px;line-height:1.5;
}

/* ---------------------------------------------------------------- core review */
.review{display:grid;grid-template-columns:minmax(288px,332px) minmax(0,1fr)}
.queue{
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0;min-width:0;
  border-right:1px solid var(--line);background:var(--surface);
}
.queueHead{padding:14px 16px 12px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.verdicts{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:8px}
.verdictCard{
  min-width:0;padding:10px 11px;border:1px solid var(--line);border-radius:12px;
  background:var(--surface-2);
}
.verdictCard .title{display:block;color:var(--muted);font-size:11.5px;font-weight:750}
.verdictCard .total{display:block;font-size:23px;font-weight:850;line-height:1.2;font-variant-numeric:tabular-nums}
.verdictCard .meta{display:block;margin-top:2px;color:var(--faint);font-size:11px;line-height:1.35}
.verdictBreakdown{display:grid;gap:3px;margin-top:6px}
.verdictRow{display:flex;align-items:center;gap:6px;min-width:0;font-size:11.5px;color:var(--muted)}
.verdictRow .label{min-width:0;flex:1 1 auto}
.verdictRow .count{font-weight:800;font-variant-numeric:tabular-nums;color:var(--text)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:700;
  background:var(--surface-2);color:var(--muted);
}
.chip:hover{background:var(--sunk)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.chip .n{opacity:.72;margin-left:5px;font-variant-numeric:tabular-nums}
.queueCount{font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.queueList{min-width:0;overflow-y:auto;overflow-x:hidden;align-content:start}
.queueGroup{border-bottom:1px solid var(--line)}
.bandToggle{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:8px;
  width:100%;padding:10px 14px;text-align:left;color:var(--text);
}
.bandToggle:hover{background:var(--surface-2)}
.bandToggle .label{font-size:13.5px;font-weight:780}
.bandToggle .count{color:var(--muted);font-size:12.5px;font-weight:750;font-variant-numeric:tabular-nums}
.bandToggle .caret{color:var(--faint);transition:transform 140ms ease}
.bandToggle[aria-expanded="true"] .caret{transform:rotate(90deg)}
.bandRows{display:grid;gap:4px;padding:0 8px 8px}
.severityDot{width:8px;height:8px;flex:0 0 auto;border-radius:50%;background:var(--none)}
.severityDot[data-band="flipped"]{background:var(--bad)}
.severityDot[data-band="wrong"]{background:var(--bad)}
.severityDot[data-band="slight"]{background:var(--warn)}
.severityDot[data-band="straight"]{background:var(--ok)}
.severityDot[data-band="missing"]{background:var(--none)}
.queueBulk{
  display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
  padding:11px 16px;border-top:1px solid var(--line);background:var(--ok-soft);
  color:var(--ok);text-align:left;
}
.queueBulk:hover:not(:disabled){background:var(--surface-2)}
.queueBulk:disabled{cursor:default;opacity:.58}
.queueBulk .copy{min-width:0}
.queueBulk b{display:block;font-size:13.5px;font-weight:800}
.queueBulk span{display:block;font-size:11.5px}
.queueBulk svg{flex:0 0 auto}
.btn.confirm{border-color:var(--ok);color:var(--ok)}
.btn.confirm:hover:not(:disabled){background:var(--ok-soft)}
.coreRow{
  display:grid;grid-template-columns:56px minmax(0,1fr) auto;align-items:center;gap:11px;
  width:100%;text-align:left;padding:7px;border-radius:11px;
  border:1.5px solid transparent;background:transparent;
}
.coreRow:hover{background:var(--surface-2)}
.coreRow[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.coreRow .thumb{
  width:56px;height:56px;border-radius:8px;background:var(--stage-bg);object-fit:contain;
  filter:brightness(2.1) contrast(1.15);
}
.coreRow .nm{font-weight:750;font-size:14px}
.coreRow .sub{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tick{
  width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  border:1.5px solid var(--line-strong);color:transparent;
}
.coreRow[data-checked="true"] .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.coreRow[data-edited="true"] .nm::after{
  content:attr(data-edited-label);margin-left:7px;padding:1px 7px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent-dark);font-size:10.5px;font-weight:800;vertical-align:middle;
}
.detail{display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0}
.viewer{position:relative;background:var(--stage-bg);display:flex;align-items:center;
  justify-content:center;min-height:0;min-width:0;overflow:hidden;padding:20px}
.viewer img{
  max-width:100%;max-height:100%;object-fit:contain;
  transform-origin:center center;transition:transform 90ms linear;border-radius:6px;
}
.viewerTag{
  position:absolute;top:14px;left:16px;
  padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;
  font-size:13px;font-weight:750;
}
.viewerNav{
  position:absolute;top:50%;transform:translateY(-50%);
  width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  background:rgba(0,0,0,.5);color:#fff;
}
.viewerNav:hover:not(:disabled){background:rgba(0,0,0,.75)}
.viewerNav.prev{left:12px} .viewerNav.next{right:12px}
.viewerNav:disabled{opacity:.25;cursor:default}
.topMark{
  position:absolute;top:14px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.62);
  font-size:11.5px;font-weight:700;letter-spacing:.06em;
}

.controls{border-top:1px solid var(--line);background:var(--surface);padding:14px 20px;display:grid;gap:12px}
.controlsTop{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.controlsTop .who{font-size:16px;font-weight:800;letter-spacing:-.01em}
.controlsTop .facts{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.reasonTag{padding:3px 9px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-size:11.5px;font-weight:750}
.dial{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px}
.dial input[type="range"]{width:100%;accent-color:var(--accent);height:26px}
.angleBox{
  display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:9px;
  background:var(--surface-2);border:1px solid var(--line);font-variant-numeric:tabular-nums;font-weight:750;
}
.angleBox input{width:66px;border:0;background:transparent;text-align:right;font-weight:750;font-variant-numeric:tabular-nums}
.angleBox input::-webkit-outer-spin-button,.angleBox input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.nudges{display:flex;gap:5px;flex-wrap:wrap}
.nudge{
  min-width:52px;height:32px;padding:0 10px;border-radius:8px;
  border:1px solid var(--line);background:var(--surface);
  font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);
}
.nudge:hover{background:var(--surface-2);color:var(--text)}
.controlsRow{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.spacer{flex:1 1 auto}
.hint{color:var(--faint);font-size:12px}
kbd{
  padding:1px 6px;margin-right:3px;border-radius:5px;border:1px solid var(--line-strong);
  background:var(--surface-2);font-size:11px;font-family:inherit;font-weight:700;
}

/* ---------------------------------------------------------------- action bar */
.actionBar{
  display:flex;align-items:center;gap:14px;
  padding:12px 20px;background:var(--surface);border-top:1px solid var(--line);
}
.actionBar[hidden]{display:none}
.actionBar .ask{min-width:0;flex:1 1 auto}
.actionBar .ask b{display:block;font-size:14.5px;font-weight:750;letter-spacing:-.01em}
.actionBar .ask span{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.saveState{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.saveState .saveIcon{width:15px;text-align:center;font-weight:850;line-height:1}
.saveState[data-tone="busy"]{color:var(--accent-dark)}
.saveState[data-tone="bad"]{color:var(--bad)}
.saveState[data-tone="dirty"]{color:var(--warn)}
.saveState[data-tone="ok"]{color:var(--ok)}

/* ---------------------------------------------------------------- export */
.exportSheet{
  width:min(1120px,calc(100vw - 32px));height:min(760px,calc(100dvh - 32px));padding:0;
  overflow:hidden;border:1px solid var(--line);border-radius:16px;
  background:var(--surface);color:var(--text);box-shadow:var(--shadow-lg)
}
.exportSheet::backdrop{background:color-mix(in srgb,var(--stage-bg) 74%,transparent)}
.exportSheetLayout{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%}
.exportSheetHead{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.exportSheetHead h2{font-size:18px}
.exportTabs{display:flex;gap:5px;margin-left:10px}
.exportTab{padding:6px 11px;border-radius:8px;color:var(--muted);font-size:13px;font-weight:750}
.exportTab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent-dark)}
.exportTab:disabled{opacity:.42;cursor:default}
.exportSheetBody{min-height:0;overflow:hidden}
.exportSheetPanel{height:100%;min-height:0;overflow:auto;padding:22px 24px}
.exportFigurePanel{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:12px}
.exportFigureIntro{display:flex;align-items:flex-start;gap:12px}
.exportFigureIntro > div{min-width:0;flex:1 1 auto}
.exportFigureUnavailable{align-self:center;justify-self:center;max-width:520px;color:var(--muted);text-align:center}
.exportInner{width:100%;max-width:1180px;min-width:0;margin:0 auto;display:grid;gap:16px}
.exportReport{display:grid;gap:14px;min-width:0}
.exportChips{padding-top:1px}
.resultGallery{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,148px),1fr));
  gap:12px;min-width:0;
}
.resultTile{
  min-width:0;overflow:hidden;text-align:left;border:1px solid var(--line);
  border-radius:12px;background:var(--surface);box-shadow:var(--shadow);
}
.resultTile:hover{border-color:var(--line-strong);background:var(--surface-2)}
.resultThumb{
  /* height:auto is load-bearing. The width/height attributes carry a real presentational
     height:900px, and aspect-ratio only applies while one axis is auto, so without this
     every tile renders 900 px tall and the gallery becomes an 18,000 px scroll. */
  display:block;width:100%;height:auto;aspect-ratio:1;background:var(--stage-bg);
  object-fit:contain;
}
.resultPlaceholder{
  display:grid;place-items:center;width:100%;aspect-ratio:1;padding:14px;
  background:var(--surface-2);color:var(--faint);font-size:12.5px;text-align:center;
}
.resultTileMeta{display:grid;gap:3px;padding:9px 10px 10px;min-width:0}
.resultTileName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:750}
/* Reserve the status line on every tile. Only the flagged ones carry a word, and
   letting the others collapse gives the gallery a ragged bottom edge that reads as
   broken rather than as "this one is fine". */
.resultState{min-height:15px;font-size:11.5px;color:var(--muted)}
.resultState .sDot{margin-right:5px}
.exportQuiet{margin:0;color:var(--muted);font-size:13.5px}
.resultSection{
  min-width:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);
  overflow:hidden;
}
.resultSection > summary{
  display:flex;align-items:center;gap:9px;padding:13px 15px;cursor:pointer;
  color:var(--text);font-weight:750;list-style:none;
}
.resultSection > summary::-webkit-details-marker{display:none}
.resultSection > summary::before{content:"›";color:var(--faint);font-size:20px;line-height:1;transition:transform 140ms ease}
.resultSection[open] > summary::before{transform:rotate(90deg)}
.resultSection > summary:hover{background:var(--surface-2)}
.resultSectionBody{min-width:0;padding:0 15px 15px;border-top:1px solid var(--line)}
.resultSectionBody > .exportQuiet{padding-top:14px}
.resultTableWrap{max-width:100%;max-height:440px;overflow:auto;margin-top:14px;border:1px solid var(--line);border-radius:9px}
.resultTable{width:max-content;min-width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
.resultTable th,.resultTable td{
  max-width:360px;padding:7px 10px;border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap;
}
.resultTable th{position:sticky;top:0;z-index:1;background:var(--surface-2);font-weight:750}
.resultTable tr:last-child td{border-bottom:0}
.resultTable th:last-child,.resultTable td:last-child{border-right:0}
.groupList{display:grid;gap:9px}
.group{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.group:last-child{border-bottom:0}
.group .txt{flex:1 1 auto;min-width:0}
.group .txt b{display:block;font-weight:750;font-size:14.5px}
.group .txt span{display:block;color:var(--muted);font-size:12.5px}
.group .cnt{color:var(--faint);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.downloadAll{justify-content:flex-end;margin-top:14px}
.newRunRow{justify-content:flex-start}

.resultDialog{
  width:min(1040px,calc(100vw - 32px));max-height:calc(100dvh - 32px);padding:0;
  overflow:hidden;border:1px solid var(--line);border-radius:16px;
  background:var(--surface);color:var(--text);box-shadow:var(--shadow-lg);
}
.resultDialog::backdrop{background:color-mix(in srgb,var(--stage-bg) 74%,transparent)}
.resultDialogLayout{display:grid;grid-template-rows:auto minmax(0,1fr) auto;max-height:calc(100dvh - 34px)}
.resultDialogHead{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.resultDialogHead h2{flex:1 1 auto;min-width:0}
.resultCompare{display:grid;grid-template-columns:1fr 1fr;gap:14px;min-height:0;overflow-y:auto;padding:16px}
.resultCompare figure{min-width:0;margin:0;display:grid;gap:7px;align-content:start}
.resultCompare figcaption{font-size:13px;font-weight:750;color:var(--muted)}
.resultCompareFrame{
  display:grid;place-items:center;aspect-ratio:1;min-width:0;overflow:hidden;
  border-radius:10px;background:var(--stage-bg);
}
.resultCompareFrame img{display:block;width:100%;height:100%;object-fit:contain}
.resultCompareFrame .resultPlaceholder{background:transparent;color:var(--faint)}
.resultDialogInfo{grid-column:1/-1;display:grid;gap:12px;min-width:0}
.resultFacts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:0}
.resultFacts div{min-width:0;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.resultFacts dt{font-size:11.5px;color:var(--muted)}
.resultFacts dd{margin:2px 0 0;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.resultReasons{margin:4px 0 0;padding-left:22px;color:var(--muted);font-size:13px}
.resultDownload{width:max-content;color:var(--accent-dark);font-size:13px;text-decoration:none;font-weight:700}
.resultDownload:hover{text-decoration:underline}
.resultDialogFoot{display:flex;align-items:center;gap:9px;padding:12px 16px;border-top:1px solid var(--line)}
.resultDialogPosition{color:var(--faint);font-size:12.5px;font-variant-numeric:tabular-nums}

/* ---------------------------------------------------------------- arrange */
.arrange{min-width:0;min-height:0;background:var(--bg)}
.arrangeUnavailable{place-self:center;max-width:560px;padding:28px;text-align:center;color:var(--muted)}
.arrangeWorkspace{display:grid;grid-template-columns:minmax(470px,.9fr) minmax(590px,1.1fr);min-width:0;min-height:0}
.arrangePane{min-width:0;min-height:0;overflow:auto;background:var(--surface)}
.arrangeMapPane{border-right:1px solid var(--line);background:var(--surface-2)}
.arrangePaneHead{
  position:sticky;top:0;z-index:5;display:flex;align-items:flex-start;gap:12px;
  padding:16px 18px;border-bottom:1px solid var(--line);background:var(--surface)
}
.arrangePaneHead > div{min-width:0;flex:1 1 auto}
.arrangeMapScroll{min-width:0;overflow:auto;padding:18px}
.arrangeMap{
  display:grid;gap:6px;width:max-content;min-width:100%;align-items:stretch;
  padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)
}
.arrangeColumnLabel{
  align-self:end;min-width:64px;padding:0 4px 7px;color:var(--muted);font-size:11.5px;
  font-weight:750;line-height:1.25;text-align:center;overflow-wrap:anywhere
}
.arrangeBandLabel{
  display:grid;place-items:center;width:86px;padding:5px 7px;border-right:2px solid var(--line-strong);
  color:var(--muted);font-size:11.5px;font-weight:750;line-height:1.25;text-align:right
}
.arrangeRowNumber{display:grid;place-items:center;color:var(--faint);font-size:11.5px;font-weight:750}
.arrangeSeat{
  position:relative;display:grid;place-items:center;
  width:var(--seat,68px);height:var(--seat,68px);padding:4px;
  overflow:hidden;border:1px solid var(--line);border-radius:11px;background:var(--stage-bg)
}
button.arrangeSeat:hover{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.arrangeSeat canvas{
  display:block;width:calc(var(--seat,68px) - 10px);height:calc(var(--seat,68px) - 10px);
  border-radius:8px
}
.arrangeSeatMissing{background:var(--sunk);border-color:var(--line-strong)}
.arrangeSeatMissing::before,.arrangeSeatMissing::after{
  content:"";position:absolute;left:9px;right:9px;top:50%;height:2px;background:var(--bad)
}
.arrangeSeatMissing::before{transform:rotate(45deg)}
.arrangeSeatMissing::after{transform:rotate(-45deg)}
.arrangeBadge{
  position:absolute;right:3px;top:3px;z-index:2;display:grid;place-items:center;min-width:20px;height:20px;
  padding:0 5px;border:2px solid var(--surface);border-radius:999px;background:var(--accent);
  color:var(--on-accent);font-size:10px;font-weight:850;font-variant-numeric:tabular-nums
}
.arrangeOtherDot{
  position:absolute;right:7px;top:7px;z-index:2;width:8px;height:8px;border:2px solid var(--surface);
  border-radius:50%;background:var(--faint)
}
.arrangeEditor{display:grid;gap:18px;align-content:start;padding:18px;min-width:0}
.arrangeSwitch{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.arrangeSwitch select{
  min-width:180px;max-width:320px;height:38px;padding:0 34px 0 11px;border:1px solid var(--line);
  border-radius:9px;background:var(--surface)
}
.arrangeTitle{
  width:100%;padding:2px 0 8px;border:0;border-bottom:1px solid var(--line);background:transparent;
  font-size:23px;font-weight:800;letter-spacing:-.015em
}
.arrangeFigureTools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.arrangeFigureTools .btn,.arrangeSwitch .btn{min-height:36px;padding:0 12px;font-size:12.5px}
.arrangeTableWrap{max-width:100%;overflow:auto;border:1px solid var(--line);border-radius:13px;background:var(--surface)}
.arrangeTable{width:max-content;min-width:100%;border-collapse:separate;border-spacing:0}
.arrangeTable th,.arrangeTable td{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.arrangeTable tr:last-child > *{border-bottom:0}
.arrangeTable tr > *:last-child{border-right:0}
.arrangeTable th{background:var(--surface-2)}
.arrangeCorner{width:178px;min-width:178px}
.arrangeColHead{width:220px;min-width:220px;padding:8px;vertical-align:top}
.arrangeLabelLine{display:flex;align-items:center;gap:5px;min-width:0}
.arrangeLabelInput{
  width:100%;min-width:0;height:34px;padding:5px 8px;border:1px solid var(--line);
  border-radius:8px;background:var(--surface);font-size:12.5px;font-weight:700
}
.arrangeMini{
  width:28px;height:28px;flex:0 0 auto;display:grid;place-items:center;border-radius:7px;color:var(--muted)
}
.arrangeMini:hover:not(:disabled){background:var(--sunk);color:var(--text)}
.arrangeMini:disabled{opacity:.35;cursor:default}
.arrangeRowHead{width:178px;min-width:178px;padding:8px;vertical-align:middle}
.arrangeRowActions{display:flex;justify-content:flex-end;gap:2px;margin-top:5px}
.arrangeFigureCell{position:relative;width:220px;min-width:220px;height:220px;padding:8px;background:var(--stage-bg)}
.arrangeCellButton{
  position:relative;display:grid;place-items:center;width:100%;height:100%;padding:0;overflow:hidden;
  border:1px dashed var(--line-strong);border-radius:10px;background:var(--stage-bg);color:var(--faint)
}
.arrangeCellButton[data-filled="true"]{border-style:solid;border-color:var(--line)}
.arrangeCellButton[data-current="true"]{outline:3px solid var(--accent);outline-offset:-3px}
.arrangeCellButton canvas{display:block;width:100%;height:100%;object-fit:contain}
.arrangeCellNumber{right:7px;top:7px;min-width:24px;height:24px;font-size:11px}
.arrangeClear{
  position:absolute;left:7px;top:7px;z-index:3;width:28px;height:28px;display:grid;place-items:center;
  border-radius:8px;background:var(--surface);color:var(--bad);box-shadow:var(--shadow)
}
.arrangeClear:hover{background:var(--bad-soft)}
.arrangeChannels{display:grid;gap:10px;padding-top:2px}
.arrangeChannelsHead{display:flex;align-items:baseline;gap:10px}
.arrangeChannelsHead .lede{margin:0}
.arrangeChannelRail{display:grid;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.arrangeChannelGroup + .arrangeChannelGroup{border-top:1px solid var(--line-strong)}
.arrangeChannelGroupTitle{
  padding:7px 12px;background:var(--surface-2);color:var(--muted);font-size:11.5px;
  font-weight:800;text-transform:uppercase;letter-spacing:.04em
}
.arrangeLayer{border-top:1px solid var(--line)}
.arrangeLayer:first-of-type{border-top:0}
.arrangeLayerMain{display:flex;align-items:center;gap:10px;padding:9px 11px;cursor:pointer}
.arrangeLayerMain:hover,.arrangeLayer[data-selected="true"] .arrangeLayerMain{background:var(--surface-2)}
.arrangeLayerMain input{width:17px;height:17px;flex:0 0 auto;margin:0;accent-color:var(--accent)}
.arrangeLayerName{flex:1 1 auto;min-width:0;font-size:13.5px;font-weight:700}
.arrangeSwatch{width:26px;height:26px;flex:0 0 auto;border:2px solid var(--surface);border-radius:8px;box-shadow:0 0 0 1px var(--line-strong)}
.arrangeLayerDetail{display:grid;gap:10px;padding:10px 12px 12px;border-top:1px solid var(--line);background:var(--surface-2)}
.arrangeCellValue{
  position:absolute;right:6px;bottom:6px;z-index:2;padding:1px 6px;border-radius:6px;
  background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-weight:750;
  font-variant-numeric:tabular-nums
}
.arrangeValuesToggle{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.arrangeGain{display:grid;grid-template-columns:auto minmax(120px,1fr) 48px;align-items:center;gap:10px;font-size:12.5px}
.arrangeGain input{width:100%;accent-color:var(--accent)}
.arrangeGain output{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.arrangeWindowLine{grid-template-columns:auto 1fr auto}
.arrangePalette{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.arrangePalette button{width:24px;height:24px;border:2px solid var(--surface);border-radius:7px;box-shadow:0 0 0 1px var(--line-strong)}
.arrangeHex{width:96px;height:30px;padding:4px 7px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.arrangeChannelToggle{justify-self:start;color:var(--accent-dark);font-size:12.5px;font-weight:750}
.arrangePreviewSize{
  margin-left:auto;color:var(--muted);font-size:12px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace
}
/* The figure is drawn on a dark stage, so give it one to sit on rather than floating the
   cores on the page surface where their black backgrounds look like holes. */
.arrangePreviewBody{
  overflow:auto;min-height:0;padding:16px;border-radius:12px;background:var(--sunk)
}
.arrangePreviewBody canvas{display:block;border-radius:10px;box-shadow:var(--shadow)}
.arrangePreviewFoot{
  display:flex;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)
}
.arrangeSaveRow{
  position:sticky;bottom:0;z-index:4;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 0;border-top:1px solid var(--line);background:var(--surface)
}

/* ---------------------------------------------------------------- log drawer */
.logDrawer{background:var(--surface);border-top:1px solid var(--line)}
.logToggle{display:flex;align-items:center;gap:9px;width:100%;padding:9px 20px;font-size:13px;font-weight:700;color:var(--muted)}
.logToggle:hover{background:var(--surface-2);color:var(--text)}
.logToggle .caret{transition:transform 160ms ease;flex:0 0 auto}
.logDrawer[data-open="true"] .logToggle .caret{transform:rotate(90deg)}
.logToggle .tail{
  flex:1 1 auto;min-width:0;text-align:right;font-weight:500;color:var(--faint);
  font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.logBody{display:none;height:min(34vh,300px);overflow:auto;background:var(--sunk);border-top:1px solid var(--line)}
.logDrawer[data-open="true"] .logBody{display:block}
.logBody pre{
  margin:0;padding:14px 20px;font-size:12px;line-height:1.65;white-space:pre-wrap;word-break:break-word;
  color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}

/* ---------------------------------------------------------------- toast */
.toast{
  position:fixed;left:50%;bottom:78px;transform:translate(-50%,14px);
  max-width:min(560px,86vw);padding:11px 18px;border-radius:11px;
  background:var(--text);color:var(--bg);font-size:13.5px;font-weight:650;
  box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;
  transition:opacity 180ms ease,transform 180ms ease;z-index:50;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1100px){
  .arrangeWorkspace{grid-template-columns:1fr;grid-template-rows:minmax(430px,52vh) minmax(560px,1fr);overflow-y:auto}
  .arrangeMapPane{border-right:0;border-bottom:1px solid var(--line)}
}

@media (max-width:1279px){
  .topbar{grid-template-columns:minmax(220px,1fr) minmax(410px,auto) minmax(320px,1fr);gap:7px;padding-inline:10px}
  .brand{font-size:13px}.brand .mark{width:25px;height:25px}
  .stageTab{gap:5px;padding-right:7px;font-size:11.5px}
  .stageSep{width:3px}
  .topbarLeft,.topbarRight{gap:6px}
  .pill{padding-inline:8px;font-size:11.5px}
  .clock{font-size:11.5px}
  .topbarExport{padding-inline:11px}
}

@media (max-width:900px){
  /* The menu bar's three tracks carry hard minmax() floors adding up to about 1070 px, so
     below that the bar pushed the whole page into a sideways scroll. Give the stage tracker
     its own row instead: it already scrolls inside itself. */
  .topbar{grid-template-columns:minmax(0,1fr) auto;row-gap:6px}
  .topbarLeft{grid-row:1;grid-column:1}
  .topbarRight{grid-row:1;grid-column:2}
  .topbarCenter{grid-row:2;grid-column:1/-1}

  /* The severity headers need to stay readable at a narrow width. A bounded queue keeps
     its own scroll without taking the viewing area away from the selected core. */
  .review{grid-template-columns:1fr;grid-template-rows:minmax(0,42vh) minmax(0,1fr)}
  .queue{border-right:0;border-bottom:1px solid var(--line)}
  .queueHead{padding:10px 14px 8px}

  .gridGate{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .gridStage{border-right:0;border-bottom:1px solid var(--line)}
  .sideRail{max-height:44vh;padding:16px}
  .actionBar{flex-wrap:wrap}
  .actionBar .ask{flex:1 1 100%}
  .group{align-items:flex-start;flex-wrap:wrap}
  .group .txt{flex-basis:100%}
  .resultCompare{grid-template-columns:1fr}
  .resultDialogInfo{grid-column:1}
  .resultFacts{grid-template-columns:1fr}

}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="topbarLeft">
      <div class="brand">
        <span class="mark"><svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2v3.06a7 7 0 0 1 5.94 5.94H22v2h-3.06A7 7 0 0 1 13 18.94V22h-2v-3.06A7 7 0 0 1 5.06 13H2v-2h3.06A7 7 0 0 1 11 5.06V2h2zm-1 5a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 3a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/></svg></span>
        CoreAlign Studio
      </div>
      <div class="slideName" id="slideName" data-i18n="noSlide"></div>
      <div class="fileMenuHost">
        <button class="btn menuButton" id="fileMenuBtn" type="button" aria-expanded="false" aria-controls="fileMenu" data-i18n="fileMenu"></button>
        <div class="fileMenu" id="fileMenu" role="menu" hidden>
          <button class="fileMenuItem" id="fileSaveProject" type="button" role="menuitem">
            <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h12l4 4v14H3V3h2zm0 2v14h14V8.5L15.5 5H15v5H7V5H5zm4 0v3h4V5H9zm-1 8h8v4H8v-4z"/></svg>
            <span class="itemLabel" data-i18n="saveProject"></span>
            <span class="itemReason" id="fileSaveProjectReason"></span>
          </button>
          <button class="fileMenuItem" id="fileOpenQupath" type="button" role="menuitem" aria-expanded="false" aria-controls="fileQupathPath">
            <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7l2 2h7v14H4V4zm2 2v12h12V8h-5.83l-2-2H6zm3 5h6v2H9v-2z"/></svg>
            <span class="itemLabel" data-i18n="openInQupath"></span>
            <span class="itemReason" id="fileOpenQupathReason"></span>
          </button>
          <div class="fileMenuPath" id="fileQupathPath" hidden>
            <code id="qPathText"></code>
            <button class="btn" id="copyQupathPath" type="button" data-i18n="copyPath"></button>
            <p data-i18n="openQupathHint"></p>
          </div>
          <button class="fileMenuItem" id="fileExportFigure" type="button" role="menuitem">
            <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm0 2v14h14V5H5zm2 11 3-4 2 2 3-4 2 6H7z"/></svg>
            <span class="itemLabel" data-i18n="exportFigure"></span>
            <span class="itemReason" id="fileExportFigureReason"></span>
          </button>
          <button class="fileMenuItem" id="fileExportResults" type="button" role="menuitem">
            <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 10h5l-6 6-6-6h5V3h2v7zm-9 9h16v-7h2v8a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-8h2v7z"/></svg>
            <span class="itemLabel" data-i18n="exportAllResults"></span>
            <span class="itemReason" id="fileExportResultsReason"></span>
          </button>
        </div>
      </div>
    </div>
    <div class="topbarCenter"><nav class="stages" id="stages" data-i18n-aria-label="workflowStages"></nav></div>
    <div class="topbarRight">
      <span class="saveState" id="saveState" role="status" aria-live="polite"></span>
      <div class="pill" id="statePill" data-tone="idle"><i class="dot"></i><span id="stateText" data-i18n="stateIdle"></span></div>
      <div class="clock" id="clock" hidden>0:00</div>
      <button class="iconBtn langBtn" id="langBtn" type="button"></button>
      <button class="iconBtn" id="themeBtn" data-i18n-title="themeSwitch" data-i18n-aria-label="themeSwitch">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 18a6 6 0 1 1 0-12 6 6 0 0 1 0 12zm0-2a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM11 1h2v3h-2V1zm0 19h2v3h-2v-3zM3.51 4.93l1.42-1.42 2.12 2.12-1.41 1.42-2.13-2.12zm12.44 12.44l1.41-1.41 2.12 2.12-1.41 1.41-2.12-2.12zM19.07 3.5l1.42 1.42-2.12 2.12-1.42-1.41 2.12-2.13zM6.64 15.95l1.41 1.41-2.12 2.12-1.41-1.41 2.12-2.12zM23 11v2h-3v-2h3zM4 11v2H1v-2h3z"/></svg>
      </button>
      <button class="btn primary topbarExport" id="exportBtn" type="button" data-i18n="export"></button>
    </div>
  </header>

  <main class="stageBody">

    <!-- 1 ---------------------------------------------------------- pick a slide -->
    <section class="panel picker" data-panel="slide" data-i18n-aria-label="stageSlide">
      <div class="pickerHead">
        <h1 data-i18n="pickTitle"></h1>
        <p class="lede" data-i18n="pickHint"></p>
        <div class="crumbs" id="crumbs"></div>
      </div>
      <div class="pickerBody"><div class="fileList" id="fileList"></div></div>
    </section>

    <!-- 2 ----------------------------------------------------------- tissue choice -->
    <section class="panel center tissuePanel" data-panel="tissue" data-i18n-aria-label="setupPanel">
      <div class="card rowGap">
        <div class="cardBody">
        <div>
          <h1 data-i18n="setupTitle"></h1>
          <p class="lede" id="setupSlide"></p>
        </div>

        <div class="choice">
          <span class="label" data-i18n="setupTissue"></span>
          <div class="segmented" id="tissueChoice" role="group" data-i18n-aria-label="tissueType">
            <button type="button" data-value="skin" aria-pressed="true">
              <span class="t" data-i18n="skin"></span>
              <span class="d" data-i18n="skinHint"></span>
            </button>
            <button type="button" data-value="other" aria-pressed="false">
              <span class="t" data-i18n="otherTissue"></span>
              <span class="d" data-i18n="otherTissueHint"></span>
            </button>
          </div>
        </div>

        <div class="priorRun warn" id="abandonedRun" hidden>
          <div class="txt">
            <b data-i18n="abandonedTitle"></b>
            <span id="abandonedNote"></span>
          </div>
        </div>

        <div class="priorRun" id="priorRun" hidden>
          <div class="txt">
            <b data-i18n="priorTitle"></b>
            <span id="priorRunNote"></span>
          </div>
          <button class="btn" id="openPrior" data-i18n="viewPrior"></button>
        </div>

        </div>

        <div class="controlsRow">
          <button class="btn quiet" id="backToPicker" data-i18n="changeSlide"></button>
          <span class="spacer"></span>
          <button class="btn primary big" id="startBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.376 12.416L8.777 19.482A.5.5 0 0 1 8 19.066V4.934a.5.5 0 0 1 .777-.416l10.599 7.066a.5.5 0 0 1 0 .832z"/></svg>
            <span data-i18n="start"></span>
          </button>
        </div>
      </div>
    </section>

    <!-- 3 ------------------------------------------------------- cores and its progress -->
    <section class="panel" id="coresPanel" data-panel="cores" data-i18n-aria-label="reviewGrid">
      <div class="stageRunView" id="runView" hidden>
        <div class="runCard">
          <h1 data-i18n="processing"></h1>
          <div class="bar indeterminate" id="runBar"><i style="width:100%"></i></div>
          <div class="runStep" id="runStep" data-i18n="openingSlide"></div>
          <div class="runCounts" id="runCounts" hidden></div>
          <ul class="activity" id="activity" data-i18n-aria-label="recentActivity"></ul>
          <div class="controlsRow" style="justify-content:center;margin-top:20px">
            <button class="btn danger" id="stopBtn" data-i18n="stop"></button>
          </div>
        </div>
      </div>
      <div class="stageEditor gridGate" id="coresEditor">
      <div class="gridStage" id="gridStage">
        <div class="gridWorkspace">
        <div class="gridCanvas" id="gridCanvas">
          <img id="gridImg" data-i18n-alt="gridImageAlt">
          <svg class="gridOverlay" id="gridOverlay" aria-hidden="true"></svg>
        </div>
        <div class="gridToolShelf">
          <div class="gridTools" role="toolbar" data-i18n-aria-label="gridToolbar">
            <button class="gridTool" id="gridSelectTool" type="button" aria-pressed="true">
              <span data-i18n="selectMove"></span><kbd>Esc</kbd>
            </button>
            <button class="gridTool" id="gridAddCore" type="button" disabled data-i18n="markPresent"></button>
            <button class="gridTool" id="gridRemoveCore" type="button" disabled>
              <span data-i18n="markMissing"></span><kbd>Del</kbd>
            </button>
            <button class="gridTool" id="gridResetCore" type="button" disabled data-i18n="resetThisCore"></button>
            <span class="gridToolSep" aria-hidden="true"></span>
            <button class="gridTool" id="zoomToggle" type="button" data-i18n="zoomFull"></button>
          </div>
          <span class="gridToolReason" id="gridToolReason" role="status" aria-live="polite"></span>
        </div>
        </div>
      </div>
      <aside class="sideRail">
        <div>
          <h2 data-i18n="gridQuestion"></h2>
          <p class="lede" data-i18n="gridQuestionHint"></p>
        </div>

var lang = "en";
try {
  var savedLang = localStorage.getItem("corealign-studio-lang");
  if (savedLang === "en" || savedLang === "th") lang = savedLang;
} catch (error) { lang = "en"; }
document.documentElement.lang = lang;

function t(key){
  var dictionary = lang === "th" ? TH : EN;
  if (key === "languageThai") dictionary = TH;
  if (key === "languageEnglish") dictionary = EN;
  var value = dictionary[key] == null ? EN[key] : dictionary[key];
  var args = arguments;
  return String(value == null ? key : value).replace(/\{(\d+)\}/g, function(_, index){
    var replacement = args[Number(index) + 1];
    return replacement == null ? "" : String(replacement);
  });
}
function applyStaticTranslations(){
  document.querySelectorAll("[data-i18n]").forEach(function(node){
    node.textContent = t(node.dataset.i18n);
  });
  ["aria-label", "title", "alt", "placeholder"].forEach(function(attribute){
    var dataName = "i18n" + attribute.split("-").map(function(part){
      return part.charAt(0).toUpperCase() + part.slice(1);
    }).join("");
    document.querySelectorAll("[data-i18n-" + attribute + "]").forEach(function(node){
      node.setAttribute(attribute, t(node.dataset[dataName]));
    });
  });
  $("langBtn").textContent = t(lang === "en" ? "languageThai" : "languageEnglish");
  $("langBtn").title = t("languageSwitch");
  $("langBtn").setAttribute("aria-label", t("languageSwitch"));
}
var api = function(path, options){
  return fetch(path, Object.assign({cache:"no-store"}, options || {})).then(function(r){
    return r.json().then(function(body){ return {ok:r.ok, body:body}; })
                   .catch(function(){ return {ok:r.ok, body:{}}; });
  }).catch(function(){ return {ok:false, body:{}}; });
};
var toastTimer = 0;
function toast(message){
  var el = $("toast"); el.textContent = message; el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 3200);
}

/* ------------------------------------------------------------------ stages */
var STAGES = [
  {key:"slide", labelKey:"stageSlide"},
  {key:"tissue", labelKey:"stageTissue"},
  {key:"cores", labelKey:"stageCores"},
  {key:"orientation", labelKey:"stageOrientation"},
  {key:"figure", labelKey:"stageFigure"}
];
var stage = "slide";
var reached = {slide:true};
var processingStage = "cores";

function buildStages(){
  var nav = $("stages"); nav.textContent = "";
  STAGES.forEach(function(item, index){
    if (index) { var sep = document.createElement("i"); sep.className = "stageSep"; nav.appendChild(sep); }
    var b = document.createElement("button");
    b.className = "stageTab"; b.dataset.key = item.key; b.type = "button";
    b.innerHTML = '<span class="num">' + (index + 1) + "</span>";
    b.appendChild(document.createTextNode(t(item.labelKey)));
    b.addEventListener("click", function(){
      if (!reached[item.key]) return;
      setStage(item.key);
      drawActionBar();
    });
    nav.appendChild(b);
  });
}
function paintStages(){
  var order = STAGES.map(function(s){ return s.key; });
  var here = order.indexOf(stage);
  document.querySelectorAll(".stageTab").forEach(function(tab){
    var index = order.indexOf(tab.dataset.key);
    tab.dataset.state = index === here ? "now" : (index < here ? "done" : "next");
    tab.disabled = !reached[tab.dataset.key];
  });
}
function setStage(next){
  stage = next;
  if (next !== "figure" || arrangeAvailable) reached[next] = true;
  document.querySelectorAll(".panel").forEach(function(panel){
    panel.classList.toggle("is-active", panel.dataset.panel === next);
  });
  paintStages();
}
function showStageEditor(name){
  $("runView").hidden = true;
  $("coresEditor").hidden = false;
  setStage(name);
  // Orientation has two views and only ever shows one of them. Un-hiding the queue here
  // unconditionally would stack it under the card grid.
  if (name === "orientation") setOrientationView(orientationView);
  else $("orientationEditor").hidden = orientationView !== "focus";
}
function showStageProgress(name){
  processingStage = name === "orientation" ? "orientation" : "cores";
  $("coresEditor").hidden = processingStage === "cores";
  $("orientationEditor").hidden = processingStage === "orientation" || orientationView !== "focus";
  $("coreGridView").hidden = processingStage === "orientation" || orientationView !== "all";
  var panel = $(processingStage + "Panel");
  if (panel && $("runView").parentNode !== panel) panel.insertBefore($("runView"), panel.firstChild);
  $("runView").hidden = false;
  setStage(processingStage);
}

var chosenSlide = null, tissue = "skin";
var browseData = null;

function browse(path){
  api("/api/browse?path=" + encodeURIComponent(path || "")).then(function(res){
    if (!res.ok) { toast(res.body.error || t("browseFailed")); return; }
    browseData = res.body;
    drawBrowse(browseData);
  });
}
function drawBrowse(data){
    var crumbs = $("crumbs"); crumbs.textContent = "";
    if (data.parent) {
      var up = document.createElement("button");
      up.type = "button"; up.textContent = t("upOneLevel");
      up.addEventListener("click", function(){ browse(data.parent); });
      crumbs.appendChild(up);
    }
    var here = document.createElement("span");
    here.className = "where"; here.textContent = data.path || "";
    crumbs.appendChild(here);

    var list = $("fileList"); list.textContent = "";
    (data.folders || []).forEach(function(folder){
      list.appendChild(fileRow("folder", folder.name, "", false, function(){ browse(folder.path); }));
    });
    (data.slides || []).forEach(function(slide){
      var blocked = !slide.reachable || !slide.folderWritable;
      var meta = !slide.reachable ? t("outsideAllowedArea")
        : (!slide.folderWritable ? t("folderNotWritable", slide.size) : slide.size);
      list.appendChild(fileRow("slide", slide.name, meta, blocked, function(){ pick(slide); }));
    });
    if (!(data.folders || []).length && !(data.slides || []).length) {
      var empty = document.createElement("p");
      empty.className = "emptyNote";
      empty.textContent = t("emptyFolder");
      list.appendChild(empty);
    }
}
function fileRow(kind, name, meta, blocked, onClick){
  var b = document.createElement("button");
  b.type = "button";
  b.className = "fileRow" + (kind === "slide" ? " slide" : "");
  if (blocked) b.setAttribute("disabled", "disabled");
  var path = kind === "slide"
    ? 'M20 5H4v14h16V5zM2 4a1 1 0 0 1 1-1h18a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V4zm5.5 8a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zM19 17l-4.5-6-3.5 4.5-2-2.5L6 17h13z'
    : 'M12.414 5H21a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h7.414l2 2zM4 5v14h16V7h-8.414l-2-2H4z';
  b.innerHTML = '<span class="ico"><svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true">' +
    '<path d="' + path + '"/></svg></span><span class="nm"></span><span class="meta"></span>';
  b.querySelector(".nm").textContent = name;
  b.querySelector(".meta").textContent = meta || "";
  if (!blocked) b.addEventListener("click", onClick);
  return b;
}
function pick(slide){
  chosenSlide = slide;
  savedProjectPath = "";
  resetSaveScope("grid");
  resetSaveScope("angles");
  gridKey = "";
  gridEdits = {};
  gridSaved = null;
  resetArrange();
  $("slideName").textContent = slide.name;
  $("setupSlide").textContent = slide.path;
  reached.tissue = true;
  setStage("tissue");
  // If this folder has been through CoreAlign before, show what is already there rather
  // than making a person run it again to find out.
  model = null; reviewKey = ""; lastGateId = "";
  api("/api/attach", {method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({slide:slide.path})}).then(function(){
      loadArrange();
      poll();
    });
}

function reasonWords(reason){
  var text = String(reason || "").trim();
  var residual = /^residual\s+([\d.]+)\s*deg$/i.exec(text);
  if (residual) return t("reasonResidual", residual[1]);
  if (/^orientation status review$/i.test(text)) return t("reasonOrientation");
  if (/^crop region review$/i.test(text)) return t("reasonCrop");
  return text;
}
function segmented(containerId, onChange){
  $(containerId).addEventListener("click", function(event){
    var button = event.target.closest("button[data-value]");
    if (!button) return;
    var children = this.children;
    for (var i = 0; i < children.length; i++)
      children[i].setAttribute("aria-pressed", String(children[i] === button));
    onChange(button.dataset.value);
  });
}
segmented("tissueChoice", function(value){ tissue = value; });
$("backToPicker").addEventListener("click", function(){ setStage("slide"); });
$("openPrior").addEventListener("click", function(){ setStage("orientation"); drawActionBar(); });

function startRun(button){
  if (!chosenSlide) { toast(t("chooseSlideFirst")); return; }
  button.disabled = true;
  var payload = {slide:chosenSlide.path, tissue:tissue};
  api("/api/run", {method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify(payload)})
  .then(function(res){
    button.disabled = false;
    if (!res.ok) { toast(res.body.error || t("startFailed")); return; }
    reviewKey = ""; model = null; lastGateId = "";
    showStageProgress("cores"); poll();
  });
}
$("startBtn").addEventListener("click", function(){ startRun(this); });
$("stopBtn").addEventListener("click", function(){
  api("/api/stop", {method:"POST"}).then(function(){ toast(t("stopped")); poll(); });
});
$("newRun").addEventListener("click", function(){
  api("/api/reset", {method:"POST"}).then(function(){
    chosenSlide = null; model = null; reviewKey = ""; lastGateId = "";
    savedProjectPath = "";
    resetSaveScope("grid");
    resetSaveScope("angles");
    resetArrange();
    reached = {slide:true};
    setStage("slide"); browse("");
  });
});
