/* ------------------------------------------------------------------ review model */
var model = null;      // the /api/review payload
var reviewKey = "";    // baseRun of the model currently drawn
var current = 0;
var visible = [];
var expandedBands = {};
var edits = {};        // core -> cumulative web adjustment in degrees
var checked = {};      // core -> true
var savedEdits = {};   // angles already saved, in the waiting run or in the file
var savedVia = "";     // "bridge" or "file", from the last save this page made

function storeKey(){ return "corealign-studio:" + (model ? model.baseRun : "none"); }
function loadLocal(){
  edits = {}; checked = {};
  try {
    var raw = JSON.parse(localStorage.getItem(storeKey()) || "{}");
    edits = raw.edits || {}; checked = raw.checked || {};
  } catch (error) { edits = {}; checked = {}; }
  Object.keys(savedEdits).forEach(function(name){
    if (!(name in edits)) edits[name] = savedEdits[name];
  });
}
function saveLocal(){
  try { localStorage.setItem(storeKey(), JSON.stringify({edits:edits, checked:checked})); }
  catch (error) { /* a full quota must not break the review */ }
}
function baseAngleOf(core){ return Number(core.adjustmentDeg || 0); }
function angleOf(core){ return core.core in edits ? Number(edits[core.core]) : baseAngleOf(core); }
function isEdited(core){ return Math.abs(angleOf(core) - baseAngleOf(core)) >= 0.05; }
function coreClassOf(core){
  if (core.status === "ok") return "ok";
  if (core.status === "review") return "review";
  if (core.status === "missing") return "missing";
  return "error";
}

var SEVERITY_BANDS = [
  {key:"flipped",  labelKey:"bandFlipped"},
  {key:"wrong",    labelKey:"bandWrong"},
  {key:"slight",   labelKey:"bandSlight"},
  {key:"straight", labelKey:"bandStraight"},
  {key:"missing",  labelKey:"bandMissing"}
];
function severityBandOf(core){
  var kind = coreClassOf(core);
  if (kind === "missing" || kind === "error") return "missing";
  var residual = core.residualDeg;
  if (residual === null || residual === undefined || !Number.isFinite(Number(residual))) return "wrong";
  residual = Number(residual);
  if (residual > 150) return "flipped";
  if (residual > 20) return "wrong";
  if (residual > 5) return "slight";
  return "straight";
}
function residualSortValue(core){
  var residual = core.residualDeg;
  return residual === null || residual === undefined || !Number.isFinite(Number(residual))
    ? -Infinity : Number(residual);
}
function groupedReviewCores(){
  var groups = {};
  SEVERITY_BANDS.forEach(function(band){ groups[band.key] = []; });
  model.cores.forEach(function(core){ groups[severityBandOf(core)].push(core); });
  SEVERITY_BANDS.forEach(function(band){
    groups[band.key].sort(function(a, b){
      var difference = residualSortValue(b) - residualSortValue(a);
      return difference || Number(a.index || 0) - Number(b.index || 0);
    });
  });
  return groups;
}
function bandsStillWaiting(){
  var groups = groupedReviewCores();
  for (var i = 0; i < SEVERITY_BANDS.length; i++) {
    var key = SEVERITY_BANDS[i].key;
    if (expandedBands[key] || key === "missing") continue;
    var waiting = (groups[key] || []).filter(function(core){ return !checked[core.core]; });
    if (waiting.length) return true;
  }
  return false;
}
function rebuildVisible(previous){
  var groups = groupedReviewCores();
  visible = [];
  SEVERITY_BANDS.forEach(function(band){
    if (expandedBands[band.key]) visible = visible.concat(groups[band.key]);
  });
  var found = visible.map(function(core){ return core.core; }).indexOf(previous);
  current = found >= 0 ? found : Math.min(current, Math.max(0, visible.length - 1));
}

function drawReview(fresh){
  if (!model || !model.available) return;
  var previous = visible[current] ? visible[current].core : "";
  if (fresh) {
    // A correction that CoreAlign has already applied comes back as the core's own
    // adjustment, and the corrections file still names it. Counting it as pending would
    // show a save button with nothing to save, and pressing it would cost one more
    // reprocess pass that changes nothing.
    savedEdits = {};
    savedVia = "";
    var applied = {};
    model.cores.forEach(function(core){ applied[core.core] = Number(core.adjustmentDeg || 0); });
    Object.keys(model.corrections || {}).forEach(function(name){
      var angle = Number(model.corrections[name]);
      if (!(name in applied) || Math.abs(applied[name] - angle) >= 0.05) savedEdits[name] = angle;
    });
    loadLocal();
    var groups = groupedReviewCores();
    expandedBands = {};
    SEVERITY_BANDS.forEach(function(band){ expandedBands[band.key] = false; });
    for (var i = 0; i < 3; i++) {
      if (groups[SEVERITY_BANDS[i].key].length) {
        expandedBands[SEVERITY_BANDS[i].key] = true;
        break;
      }
    }
    current = 0;
    previous = "";
  }
  drawVerdicts();
  rebuildVisible(previous);
  updateQueueCount();
  drawQueue(true);
  drawDetail();
  drawActionBar();
}
function drawVerdicts(){
  var groups = groupedReviewCores();
  var straight = groups.straight.length;
  var attention = groups.flipped.length + groups.wrong.length + groups.slight.length;
  var withResult = model.cores.length - groups.missing.length;
  var percentage = withResult ? Math.round(straight * 100 / withResult) : 0;
  var box = $("filterChips");
  box.innerHTML =
    '<section class="verdictCard" aria-label="' + t("verdictStraightAria") + '">' +
      '<span class="title">' + t("verdictStraightLabel") + '</span><b class="total"></b><span class="meta"></span>' +
    '</section>' +
    '<section class="verdictCard" aria-label="' + t("verdictReviewAria") + '">' +
      '<span class="title">' + t("verdictReviewLabel") + '</span><b class="total"></b><div class="verdictBreakdown"></div>' +
    '</section>';
  var cards = box.querySelectorAll(".verdictCard");
  cards[0].querySelector(".total").textContent = straight;
  cards[0].querySelector(".meta").textContent = t("verdictPercentage", percentage);
  cards[1].querySelector(".total").textContent = attention;
  var breakdown = cards[1].querySelector(".verdictBreakdown");
  SEVERITY_BANDS.slice(0, 3).forEach(function(band){
    if (!groups[band.key].length) return;
    var row = document.createElement("div");
    row.className = "verdictRow";
    row.innerHTML = '<i class="severityDot" data-band="' + band.key + '"></i>' +
      '<span class="label"></span><span class="count"></span>';
    row.querySelector(".label").textContent = t(band.labelKey);
    row.querySelector(".count").textContent = groups[band.key].length;
    breakdown.appendChild(row);
  });
}
function updateStraightBulk(){
  var straight = groupedReviewCores().straight;
  var left = straight.filter(function(core){ return !checked[core.core]; }).length;
  var button = $("bulkStraight");
  button.hidden = left === 0;
  $("bulkStraightLabel").textContent = t("bulkStraight", left);
}
function updateQueueCount(){
  var groups = groupedReviewCores();
  var left = groups.flipped.concat(groups.wrong, groups.slight).filter(function(core){
    return !checked[core.core];
  }).length;
  $("queueCount").textContent = left
    ? t("queueRemaining", left)
    : t("queueEmpty");
  updateStraightBulk();
  syncQueueRowStates();
}
function residualLabel(core){
  var residual = residualSortValue(core);
  return residual === -Infinity ? t("residualUnknown") : t("residualKnown", residual.toFixed(1));
}
function makeCoreRow(core, index){
  var b = document.createElement("button");
  b.type = "button"; b.className = "coreRow";
  b.dataset.visibleIndex = String(index);
  b.dataset.checked = String(!!checked[core.core]);
  b.dataset.edited = String(isEdited(core));
  b.dataset.editedLabel = t("edited");
  if (index === current) b.setAttribute("aria-current", "true");
  b.innerHTML =
    '<img class="thumb" alt="" loading="lazy" decoding="async">' +
    '<span><span class="nm"></span><br><span class="sub"></span></span>' +
    '<span class="tick" aria-hidden="true"><svg width="13" height="13" viewBox="0 0 24 24">' +
    '<path d="M10 15.172l9.192-9.193 1.415 1.414L10 18l-6.364-6.364 1.414-1.414z"/></svg></span>';
  b.querySelector(".nm").textContent = core.core;
  b.querySelector(".sub").textContent = residualLabel(core);
  b.setAttribute("aria-label", core.core + " · " + residualLabel(core) +
    (checked[core.core] ? " · " + t("accepted") : ""));
  if (core.rotated) b.querySelector(".thumb").src = "/project/" + core.rotated;
  b.addEventListener("click", function(){
    current = index;
    markCurrentRow();
    drawDetail();
  });
  return b;
}
function drawQueue(scrollCurrent){
  var list = $("queueList"); list.textContent = "";
  var groups = groupedReviewCores();
  SEVERITY_BANDS.forEach(function(band){
    var cores = groups[band.key];
    if (!cores.length) return;
    var group = document.createElement("section");
    group.className = "queueGroup";
    var button = document.createElement("button");
    button.type = "button"; button.className = "bandToggle";
    button.setAttribute("aria-expanded", String(!!expandedBands[band.key]));
    button.setAttribute("aria-controls", "bandRows-" + band.key);
    button.innerHTML = '<i class="severityDot" data-band="' + band.key + '"></i>' +
      '<span class="label"></span><span class="count"></span>' +
      '<svg class="caret" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true">' +
      '<path d="M13.172 12l-4.95-4.95 1.414-1.414L16 12l-6.364 6.364-1.414-1.414z"/></svg>';
    button.querySelector(".label").textContent = t(band.labelKey);
    button.querySelector(".count").textContent = cores.length;
    button.addEventListener("click", function(){
      var previous = visible[current] ? visible[current].core : "";
      expandedBands[band.key] = !expandedBands[band.key];
      rebuildVisible(previous);
      drawQueue(!previous);
      updateQueueCount();
      drawDetail();
    });
    group.appendChild(button);
    var rows = document.createElement("div");
    rows.className = "bandRows"; rows.id = "bandRows-" + band.key;
    rows.hidden = !expandedBands[band.key];
    if (expandedBands[band.key]) {
      cores.forEach(function(core){ rows.appendChild(makeCoreRow(core, visible.indexOf(core))); });
    }
    group.appendChild(rows);
    list.appendChild(group);
  });
  var active = currentQueueRow();
  if (active && scrollCurrent !== false) active.scrollIntoView({block:"nearest"});
}
function currentQueueRow(){
  return $("queueList").querySelector('.coreRow[data-visible-index="' + current + '"]');
}
function syncQueueRowStates(){
  $("queueList").querySelectorAll(".coreRow").forEach(function(row){
    var core = visible[Number(row.dataset.visibleIndex)];
    if (!core) return;
    row.dataset.checked = String(!!checked[core.core]);
    row.dataset.edited = String(isEdited(core));
    row.dataset.editedLabel = t("edited");
    row.setAttribute("aria-label", core.core + " · " + residualLabel(core) +
      (checked[core.core] ? " · " + t("accepted") : ""));
  });
}
function markCurrentRow(){
  var list = $("queueList");
  list.querySelectorAll(".coreRow").forEach(function(row){
    if (Number(row.dataset.visibleIndex) === current) row.setAttribute("aria-current", "true");
    else row.removeAttribute("aria-current");
  });
  var active = currentQueueRow();
  if (active) active.scrollIntoView({block:"nearest"});
}
function drawDetail(){
  var core = visible[current];
  $("prevCore").disabled = current <= 0;
  // Next stays live while any folded band still holds a core waiting for a decision · the
  // handler opens the next band and steps into it. Disabling it at the end of the visible
  // list is what made the review dead-end after the first three cores.
  $("nextCore").disabled = current >= visible.length - 1 && !bandsStillWaiting();
  var img = $("viewerImg");
  if (!core) {
    img.removeAttribute("src"); img.dataset.core = "";
    $("coreName").textContent = "–";
    $("coreFacts").textContent = "";
    $("viewerTag").textContent = "";
    $("coreReason").hidden = true;
    return;
  }
  if (img.dataset.core !== core.core) {
    img.dataset.core = core.core;
    img.src = core.rotated ? "/project/" + core.rotated : "";
    img.alt = "core " + core.core;
  }
  $("coreName").textContent = core.core;
  var residual = core.residualDeg == null ? "–" : core.residualDeg.toFixed(1) + "°";
  var confidence = core.confidence == null ? "–" : Math.round(core.confidence * 100) + "%";
  var applied = core.rotateToTopDeg == null ? "–" : core.rotateToTopDeg.toFixed(1) + "°";
  $("coreFacts").textContent = t("coreFacts", core.row, core.col, applied, confidence, residual);
  $("viewerTag").textContent = core.core + "  ·  " + (current + 1) + "/" + visible.length;
  var reason = (core.reasons || []).map(reasonWords).join(" · ");
  $("coreReason").hidden = !reason;
  $("coreReason").textContent = reason;
  setAngle(angleOf(core), false);
  $("confirmLabel").textContent = checked[core.core] ? t("undoAccept") : t("correct");
}
function setAngle(value, mark){
  var core = visible[current];
  if (!core) return;
  var angle = Math.max(-180, Math.min(180, Number(value) || 0));
  $("angle").value = String(angle);
  $("angleNum").value = String(Math.round(angle * 10) / 10);
  // Rotating a contained image clips its corners. Scale by 1/(|cos|+|sin|) so the whole
  // core stays inside the frame at every angle.
  var delta = angle - baseAngleOf(core);
  var radians = delta * Math.PI / 180;
  var fit = 1 / (Math.abs(Math.cos(radians)) + Math.abs(Math.sin(radians)));
  $("viewerImg").style.transform = "rotate(" + delta + "deg) scale(" + fit.toFixed(4) + ")";
  if (!mark) return;
  if (Math.abs(angle - baseAngleOf(core)) < 0.05) delete edits[core.core];
  else edits[core.core] = angle;
  saveLocal();
  var row = currentQueueRow();
  if (row) row.dataset.edited = String(isEdited(core));
  drawActionBar();
}
$("angle").addEventListener("input", function(){ setAngle(this.value, true); });
$("angleNum").addEventListener("change", function(){ setAngle(this.value, true); });
document.querySelectorAll("[data-nudge]").forEach(function(button){
  button.addEventListener("click", function(){
    setAngle(Number($("angle").value) + Number(this.dataset.nudge), true);
  });
});
$("resetAngle").addEventListener("click", function(){
  var core = visible[current];
  if (!core) return;
  delete edits[core.core];
  saveLocal();
  setAngle(baseAngleOf(core), false);
  var row = currentQueueRow();
  if (row) row.dataset.edited = "false";
  drawActionBar();
});
$("prevCore").addEventListener("click", function(){
  if (current > 0) { current--; markCurrentRow(); drawDetail(); }
});
$("nextCore").addEventListener("click", function(){
  if (current < visible.length - 1) { current++; markCurrentRow(); drawDetail(); return; }
  // At the end of what is on screen. The reviewer is not finished · the next band is just
  // folded away. Open it and step into it rather than going silent.
  var groups = groupedReviewCores();
  var opened = "";
  for (var i = 0; i < SEVERITY_BANDS.length && !opened; i++) {
    var key = SEVERITY_BANDS[i].key;
    if (expandedBands[key] || key === "missing") continue;
    var waiting = (groups[key] || []).filter(function(core){ return !checked[core.core]; });
    if (waiting.length) { expandedBands[key] = true; opened = key; }
  }
  if (!opened) return;
  var here = visible[current] ? visible[current].core : "";
  rebuildVisible(here);
  drawQueue();
  if (current < visible.length - 1) current++;
  markCurrentRow();
  drawDetail();
});
$("confirmCore").addEventListener("click", function(){ toggleChecked(); });
$("bulkStraight").addEventListener("click", function(){
  var straight = groupedReviewCores().straight;
  var pending = straight.filter(function(core){ return !checked[core.core]; });
  if (!pending.length) return;
  pending.forEach(function(core){ checked[core.core] = true; });
  saveLocal();
  updateQueueCount();
  drawDetail();
  drawActionBar();
  toast(t("acceptedStraight", pending.length));
});

function toggleChecked(){
  var core = visible[current];
  if (!core) return;
  if (checked[core.core]) delete checked[core.core]; else checked[core.core] = true;
  saveLocal();
  var row = $("queueList").children[current];
  if (row) row.dataset.checked = String(!!checked[core.core]);
  $("confirmLabel").textContent = checked[core.core] ? t("undoAccept") : t("correct");
  updateQueueCount();
  if (checked[core.core] && current < visible.length - 1) {
    current++; markCurrentRow(); drawDetail();
  }
  drawActionBar();
}

document.addEventListener("keydown", function(event){
  if (stage !== "review") return;
  var target = event.target || {};
  var tag = (target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea") return;
  if (event.key === "ArrowLeft")  { event.preventDefault(); $("prevCore").click(); }
  if (event.key === "ArrowRight") { event.preventDefault(); $("nextCore").click(); }
  if (event.key === " ")          { event.preventDefault(); toggleChecked(); }
  if (event.key === "0")          { event.preventDefault(); $("resetAngle").click(); }
});

/* ------------------------------------------------------------------ saving edits */
function pendingEdits(){
  if (!model || !model.cores) return [];
  return model.cores.filter(isEdited).map(function(core){
    return {core:core.core, rotationAdjustmentDeg:Math.round(angleOf(core) * 10) / 10};
  });
}
function editsMatchSaved(){
  var now = pendingEdits();
  var keys = Object.keys(savedEdits);
  if (now.length !== keys.length) return false;
  return now.every(function(item){
    var saved = savedEdits[item.core];
    return saved != null && Math.abs(Number(saved) - item.rotationAdjustmentDeg) < 0.05;
  });
}
function setSaveState(text, tone, el){
  el = el || $("saveState");
  el.textContent = text || "";
  el.dataset.tone = tone || "";
}
$("saveEdits").addEventListener("click", function(){
  var payload = pendingEdits();
  setSaveState(t("saving"), "busy");
  api("/api/corrections", {method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({corrections:payload})})
  .then(function(res){
    if (!res.ok || res.body.ok === false) {
      setSaveState(res.body.error || t("saveFailed"), "bad");
      return;
    }
    savedEdits = {};

var openGate = null;

  }

function gateButton(gate){
  return t(gate && gate.gate === "orientation" ? "gateOrientationButton" : "gateGridButton");

function drawActionBar(){
  var bar = $("actionBar");
  var show = (stage === "grid" || stage === "review");
  bar.hidden = !show;
  if (!show) return;
  var go = $("gateGo");
  var save = $("saveEdits");

  if (stage === "grid") {
    save.hidden = true;
    var gridChanges = Object.keys(gridEdits).length;
    var gridSynced = gridFingerprint() === gridSaved;
    $("saveGrid").hidden = gridChanges === 0;
    $("saveGrid").disabled = gridSynced;
    if (gridChanges && gridSynced) setSaveState(t("savedPositions", gridChanges), "ok");
    else if (gridChanges) setSaveState(t("unsavedPositions", gridChanges), "");
    else setSaveState("");

    $("askTitle").textContent = openGate
      ? (gridChanges ? t("editedPositions", gridChanges) : gateTitle(openGate))
      : t("waitingGridReview");
    $("askSummary").textContent = openGate
      ? (gridChanges
          ? t("saveGridFirstSummary")
          : gateSummary(openGate))
      : "";
    go.textContent = !openGate ? t("waiting")
      : (gridChanges && !gridSynced) ? t("saveBeforeContinue")
      : gridChanges ? t("applyGridEdits")
      : gateButton(openGate);
    go.dataset.act = "gate";
    go.disabled = !openGate || (gridChanges > 0 && !gridSynced);
    return;
  }
  $("saveGrid").hidden = true;

  var changes = pendingEdits().length;
  var synced = editsMatchSaved();
  var pending = model && model.cores
    ? model.cores.filter(function(c){ return c.status === "review"; }) : [];
  var left = pending.filter(function(c){ return !checked[c.core]; }).length;

  save.hidden = changes === 0 && synced;
  save.disabled = synced;
  if (changes && synced) setSaveState(
    t(savedVia === "file" ? "savedCoresForNextRun" : "savedCores", changes), "ok");
  else if (changes) setSaveState(t("unsavedCores", changes), "");
  else setSaveState("");

  if (openGate) {
    $("askTitle").textContent = left
      ? t("reviewRemaining", left)
      : t("reviewComplete");
    $("askSummary").textContent = changes
      ? t("angleEditsSummary", changes)
      : t("approveSummary");
    go.textContent = (changes && !synced)
      ? t("saveBeforeApprove")
      : gateButton(openGate);
    go.dataset.act = "gate";
    go.disabled = changes > 0 && !synced;
  } else if (runState === "complete" && changes === 0) {
    // Approved and the files exist. Offering to run again to approve would be wrong, and
    // pressing it would do nothing useful. Point at the results instead.
    $("askTitle").textContent = t("approvedTitle");
    $("askSummary").textContent = t("approvedSummary");
    go.textContent = t("goToResults");
    go.dataset.act = "export";
    go.disabled = false;
    return;
  } else {
    $("askTitle").textContent = runState === "complete"
      ? t("approvedWithEditsTitle")
      : t("finishedTitle");
    $("askSummary").textContent = changes
      ? t("rerunEditedSummary", changes)
      : t("rerunSummary");
    go.textContent = (changes && !synced) ? t("saveBeforeRun")
      : (runState === "complete" ? t("rerunEdited") : t("rerunApproval"));
    go.dataset.act = "run";
    go.disabled = changes > 0 && !synced;
  }
}
$("gateGo").addEventListener("click", function(){
  var button = this;

  if (!openGate) { startRun(button); return; }
  button.disabled = true;
  api("/api/bridge/gate", {method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({gate:openGate.gate, decision:"continue"})})
  .then(function(res){

/* ------------------------------------------------------------------ grid editor */
// Somebody driving Studio has no QuPath window to draw a correction in. The circles are
// drawn over the QC image instead, and dragging one is the same edit as moving an
// annotation by hand: CoreAlign's step 3 receives it either way.
var gridEdits = {};     // core -> {action, centerX, centerY, diameter}
var pickedCore = "";
var gridDrag = null;

function gridCores(){ return (model && model.grid && model.grid.cores) || []; }
function gridScale(){
  // Slide pixels to rendered pixels. The overlay image is a render of the whole slide, so
  // one factor covers both axes; use the rendered width, which changes with zoom.
  var img = $("gridImg");
  var slideW = Number(model && model.grid && model.grid.slideWidth) || 0;
  var shown = img.getBoundingClientRect().width;
  return (slideW > 0 && shown > 0) ? shown / slideW : 0;
}
function nominalDiameter(){
  // A position marked empty carries a placeholder ROI about a twentieth of a core wide, so
  // reading a diameter off one describes nothing. Use the middle of the real ones.
  var sizes = gridCores().filter(function(c){ return !c.missing && c.diameter > 0; })
                         .map(function(c){ return Number(c.diameter); })
                         .sort(function(a, b){ return a - b; });
  return sizes.length ? sizes[Math.floor(sizes.length / 2)] : 0;
}
function coreNow(core){
  var edit = gridEdits[core.core];
  return {
    core: core.core, row: core.row, col: core.col,
    centerX: edit && edit.centerX != null ? edit.centerX : core.centerX,
    centerY: edit && edit.centerY != null ? edit.centerY : core.centerY,
    diameter: edit && edit.diameter != null ? edit.diameter : core.diameter,
    missing: edit ? (edit.action === "mark_missing") : core.missing,
    edited: !!edit,
    confidence: core.confidence

}
var fitRetry = 0;
function fitGridCanvas(){
  var stage = $("gridStage"), img = $("gridImg");
  if (!img.naturalWidth) return 0;
  var zoomed = stage.dataset.zoom === "true";
  // Leave room for the padding the stage carries, so a fitted image never sits under its
  // own scrollbars.
  var room = 36;
  var scale = zoomed ? 1 : Math.min(
    (stage.clientWidth - room) / img.naturalWidth,
    (stage.clientHeight - room) / img.naturalHeight);
  if (!(scale > 0)) {
    // The panel can still be display:none when this first runs, so the stage measures
    // zero. Try again on the next frame rather than leaving a collapsed image on screen.
    if (fitRetry < 20) { fitRetry++; requestAnimationFrame(drawGridOverlay); }
    return 0;
  }
  fitRetry = 0;
  img.style.width = Math.round(img.naturalWidth * scale) + "px";
  img.style.height = Math.round(img.naturalHeight * scale) + "px";
  return scale;
}

function drawGridOverlay(){
  var svg = $("gridOverlay"), img = $("gridImg");
  if (!svg || !img || !img.naturalWidth) return;
  fitGridCanvas();
  var scale = gridScale();
  var cores = gridCores();
  svg.textContent = "";
  if (!scale || !cores.length) return;
  var rect = img.getBoundingClientRect();
  svg.setAttribute("viewBox", "0 0 " + rect.width + " " + rect.height);
  cores.forEach(function(raw){
    var core = coreNow(raw);
    if (core.centerX == null || core.diameter == null) return;
    var c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c.setAttribute("cx", (core.centerX * scale).toFixed(2));
    c.setAttribute("cy", (core.centerY * scale).toFixed(2));
    c.setAttribute("r", Math.max(5, core.diameter * scale / 2).toFixed(2));
    c.setAttribute("data-state", core.edited ? "edited" : (core.missing ? "missing" : "present"));
    if (core.core === pickedCore) c.setAttribute("data-picked", "true");
    c.dataset.core = core.core;
    svg.appendChild(c);
  });
}
function markPicked(){

  // pointerdown, and a rebuild there would destroy the very element being dragged: the
  // drag would end before it started, and the pointer capture would go with it.
  var circles = $("gridOverlay").querySelectorAll("circle");
  for (var i = 0; i < circles.length; i++) {
    if (circles[i].dataset.core === pickedCore) circles[i].setAttribute("data-picked", "true");
    else circles[i].removeAttribute("data-picked");

}
function pickCore(name){

  var panel = $("gridPicked");
  if (!raw) { panel.hidden = true; markPicked(); return; }
  var core = coreNow(raw);
  $("pickedName").textContent = core.core;
  var confidence = core.confidence ? Math.round(Number(core.confidence) * 100) + "%" : "–";
  var factsKey = core.missing
    ? (core.edited ? "pickedMissingEdited" : "pickedMissing")
    : (core.edited ? "pickedPresentEdited" : "pickedPresent");
  $("pickedFacts").textContent = t(factsKey, core.row, core.col, confidence);
  $("markMissing").hidden = core.missing;
  $("markPresent").hidden = !core.missing;
  $("undoCore").hidden = !core.edited;
  panel.hidden = false;
  markPicked();
}
function editCore(name, action, x, y) {
  var raw = gridCores().filter(function(c){ return c.core === name; })[0];
  if (!raw) return;
  var base = coreNow(raw);
  var nominal = nominalDiameter();
  gridEdits[name] = {
    action: action,
    centerX: x == null ? base.centerX : x,
    centerY: y == null ? base.centerY : y,
    // Bringing a position back into use means a core-sized circle, whatever the placeholder
    // it is replacing happened to be.

  markPicked();

$("gridOverlay").addEventListener("pointerdown", function(event){
  var target = event.target;
  if (!target || target.tagName !== "circle") return;
  event.preventDefault();
  pickCore(target.dataset.core);
  var scale = gridScale();
  if (!scale) return;
  var rect = $("gridImg").getBoundingClientRect();
  gridDrag = {core: target.dataset.core, scale: scale, rect: rect, moved: false, node: target};
  target.classList.add("dragging");
  target.setPointerCapture(event.pointerId);
});
$("gridOverlay").addEventListener("pointermove", function(event){
  if (!gridDrag) return;
  var x = (event.clientX - gridDrag.rect.left) / gridDrag.scale;
  var y = (event.clientY - gridDrag.rect.top) / gridDrag.scale;
  gridDrag.moved = true;
  gridDrag.node.setAttribute("cx", (x * gridDrag.scale).toFixed(2));
  gridDrag.node.setAttribute("cy", (y * gridDrag.scale).toFixed(2));
  gridDrag.at = {x: x, y: y};
});
$("gridOverlay").addEventListener("pointerup", function(){
  if (!gridDrag) return;
  gridDrag.node.classList.remove("dragging");
  if (gridDrag.moved && gridDrag.at) {
    // Dragging a circle onto tissue is a move; doing it to a position marked empty is
    // also a statement that there is tissue there after all.
    var raw = gridCores().filter(function(c){ return c.core === gridDrag.core; })[0];
    var action = (raw && coreNow(raw).missing) ? "restore" : "move";
    editCore(gridDrag.core, action, gridDrag.at.x, gridDrag.at.y);
  }
  gridDrag = null;
});
$("markMissing").addEventListener("click", function(){ editCore(pickedCore, "mark_missing"); });
$("markPresent").addEventListener("click", function(){ editCore(pickedCore, "restore"); });
$("undoCore").addEventListener("click", function(){
  delete gridEdits[pickedCore];

  drawGridOverlay();
  markPicked();
  drawActionBar();
});
$("saveGrid").addEventListener("click", function(){

    var edit = gridEdits[name];

var gridSaved = null;

function gridFingerprint(){
  // Not a count. Dragging an already-saved core leaves the count unchanged while the
  // coordinates move, and a count comparison would call that "already saved" and let the
  // gate through with the old position.
  return Object.keys(gridEdits).sort().map(function(core){
    var edit = gridEdits[core];
    return [core, edit.action, Math.round(edit.centerX), Math.round(edit.centerY),
            Math.round(edit.diameter || 0)].join(":");
  }).join("|");
}
function metric(value, label, tone){

  var b = document.createElement("b"); b.textContent = value;

function arrangeCellAt(figure, row, col){

function arrangeTile(core, channel){

  if (arrangeTileCache.has(key)) return arrangeTileCache.get(key);

      // decode() is a smoothness optimisation, not a precondition: an image that has fired
      // onload can already be drawn. It is also tied to painting, so in a tab that is not
      // being rendered it settles neither way, and because this promise is cached that
      // strands the tile for the life of the page rather than merely delaying it. Measured
      // on a real run: onload true, decode still unsettled 45 seconds later, 117 cores black.
      if (image.decode) { try { image.decode().catch(function(){}); } catch (error) { } }
      resolve(image);
    };
    image.onerror = function(){ resolve(null); };
    var padded = String(channel);
    while (padded.length < 2) padded = "0" + padded;
    // The tiles are served immutable for a year, which is right for a file that never
    // changes under a given URL and wrong the moment they are cut again. Carrying the
    // manifest stamp in the query makes a fresh cut a fresh URL, so a browser that holds
    // last week's washed-out tiles asks for the new ones instead of keeping the old.
    image.src = projectUrl(arrangeTileBase + "/" + core + "/" + padded + ".png") +
      arrangeTileVersion;
  });
  arrangeTileCache.set(key, promise);

  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}
function arrangeRgb(hex){
  var clean = String(hex || "#FFFFFF").replace("#", "");
  if (!/^[0-9a-f]{6}$/i.test(clean)) clean = "FFFFFF";
  return {r:parseInt(clean.slice(0, 2), 16), g:parseInt(clean.slice(2, 4), 16),
          b:parseInt(clean.slice(4, 6), 16)};

function arrangeComposite(canvas, coreName, size, figure, token){
  var core = ((arrangeManifest && arrangeManifest.cores) || []).filter(function(item){
    return item.core === coreName;
  })[0];
  var visibleChannels = (figure.channels || []).filter(function(config){
    return config.visible && arrangeChannelManifest(config.index);
  }).map(function(config){
    var manifest = arrangeChannelManifest(config.index);
    return {index:config.index, colour:arrangeChannelColour(config, manifest),
            window:arrangeChannelWindow(config)};
  });
  var jobs = visibleChannels.map(function(config){
    return arrangeTile(coreName, config.index).then(function(image){
      if (!image) return null;
      var layer = document.createElement("canvas");
      layer.width = size; layer.height = size;
      var context = layer.getContext("2d", {willReadFrequently:true});
      context.translate(size / 2, size / 2);
      var angle = Number(core && core.rotationDeg) || 0;
      var radians = angle * Math.PI / 180;
      context.rotate(radians);
      // The tile is cut 1.45x wider than the core so a rotation has corners to draw from,
      // which also means the core itself only covers about 69% of it. Draw the tile
      // enlarged by that same factor and the core fills the frame, which is what a figure
      // panel wants. It stays safe at every angle because a rotated square needs at most
      // |cos|+|sin| = 1.414 of its own width and the cut gives 1.45.
      var support = Math.max(Number(arrangeManifest && arrangeManifest.rotationSupport) || 1,
        Math.abs(Math.cos(radians)) + Math.abs(Math.sin(radians)));
      var span = size * support;
      context.drawImage(image, -span / 2, -span / 2, span, span);
      context.setTransform(1, 0, 0, 1, 0, 0);
      var pixels = context.getImageData(0, 0, size, size);
      var rgb = arrangeRgb(config.colour);
      var black = config.window.black;
      var span = Math.max(config.window.white - black, 1);
      for (var pixel = 0; pixel < pixels.data.length; pixel += 4) {
        var strength = Math.max(0, Math.min(255, (pixels.data[pixel] - black) * 255 / span));
        pixels.data[pixel] = Math.round(strength * rgb.r / 255);
        pixels.data[pixel + 1] = Math.round(strength * rgb.g / 255);
        pixels.data[pixel + 2] = Math.round(strength * rgb.b / 255);
      }
      context.putImageData(pixels, 0, 0);
      return layer;
    });
  });
  return Promise.all(jobs).then(function(layers){
    if (token && canvas._arrangeToken !== token) return canvas;
    canvas.width = size; canvas.height = size;
    var context = canvas.getContext("2d");
    context.fillStyle = arrangeCss("--stage-bg");
    context.fillRect(0, 0, size, size);
    context.globalCompositeOperation = "screen";
    layers.forEach(function(layer){ if (layer) context.drawImage(layer, 0, 0); });
    context.globalCompositeOperation = "source-over";
    return canvas;
  });
}
function arrangeWantedToken(canvas){

// An IntersectionObserver only speaks while the document is being rendered, so a tab that is
// still in the background when this stage opens never hears about the cores that are already
// on screen and every one of them stays black until the person scrolls. Reading the geometry
// directly costs one layout pass over about a hundred small elements and does not care
// whether the page has been painted yet, so it is the honest belt to the observer's braces.
var arrangeSweepPending = false;
function renderArrangeInView(){
  arrangeSweepPending = false;
  var margin = 180, limit = window.innerHeight || 800;
  document.querySelectorAll("canvas.arrangeCoreCanvas").forEach(function(canvas){
    if (canvas._arrangeToken === arrangeWantedToken(canvas)) return;
    var box = canvas.getBoundingClientRect();
    if (!box.width && !box.height) return;
    if (box.bottom < -margin || box.top > limit + margin) return;
    renderArrangeCanvas(canvas);
  });
}
function scheduleArrangeSweep(){

  arrangeSweepPending = true;
  setTimeout(renderArrangeInView, 60);

function queueArrangeCanvas(canvas, core, size){

  canvas._arrangeSize = size;

  scheduleArrangeSweep();
}
// Scroll does not bubble, so the capture phase is the only way to hear either pane without
// hunting down the scrolling element. All three of these are moments when a core that was
// never drawn can be on screen: the pane moved, the tab came forward, the layout reflowed.
document.addEventListener("scroll", function(){
  if (arrangeAvailable) scheduleArrangeSweep();
}, true);
document.addEventListener("visibilitychange", function(){
  if (!document.hidden && arrangeAvailable) scheduleArrangeSweep();

window.addEventListener("resize", function(){

  canvas._arrangeToken = token;

}
function refreshArrangeCanvases(){
  arrangeRenderVersion++;

    if (arrangeObserver) {
      arrangeObserver.unobserve(canvas);
      arrangeObserver.observe(canvas);

}

function fillArrangeFromLayout(){

  figure.rows.forEach(function(row, rowIndex){
    figure.cols.forEach(function(column, colIndex){
      if (arrangeCellAt(figure, rowIndex, colIndex)) return;
      if (!Array.isArray(row.slideRows) || column.slideCol == null) return;
      var found = null;
      for (var i = 0; i < cores.length; i++) {
        if (!cores[i].missing && row.slideRows.map(Number).indexOf(Number(cores[i].row)) >= 0 &&
            Number(cores[i].col) === Number(column.slideCol)) { found = cores[i]; break; }
      }

function drawArrangeLabel(context, text, x, y, maxWidth, align){

// Rendering the figure and doing something with it are two different jobs. Preview and
// export must show the same pixels or the preview is worse than none, so they share this.
function buildArrangeFigureCanvas(){
  var figure = arrangeFigure();
  if (!figure) return Promise.reject(new Error("no figure"));
  var cellSize = 256, rowLabelWidth = 190, titleHeight = 70, colLabelHeight = 70;
  var cells = [], jobs = [];
  figure.rows.forEach(function(_, row){
    figure.cols.forEach(function(_, col){
      var item = arrangeCellAt(figure, row, col), canvas = document.createElement("canvas");
      canvas.width = cellSize; canvas.height = cellSize;
      cells.push({row:row, col:col, cell:item, canvas:canvas});
      if (item) jobs.push(arrangeComposite(canvas, item.core, cellSize, figure, ""));
    });
  });
  return Promise.all(jobs).then(function(){
    var canvas = document.createElement("canvas");
    canvas.width = rowLabelWidth + figure.cols.length * cellSize;
    canvas.height = titleHeight + colLabelHeight + figure.rows.length * cellSize;
    var context = canvas.getContext("2d");
    // The same stack the page uses. A bare sans-serif resolves to a face with no Thai and
    // burns empty boxes into the file, which is only discovered after it is sent to somebody.
    var face = arrangeCss("--font-ui") || "system-ui, sans-serif";
    context.fillStyle = arrangeCss("--surface");
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.fillStyle = arrangeCss("--text");
    context.font = "800 28px " + face;
    drawArrangeLabel(context, figure.title, 20, titleHeight / 2, canvas.width - 40, "left");
    context.font = "700 17px " + face;
    figure.cols.forEach(function(column, col){
      drawArrangeLabel(context, arrangeColText(figure, col),
        rowLabelWidth + col * cellSize + cellSize / 2,
        titleHeight + colLabelHeight / 2, cellSize - 24, "center");
    });
    figure.rows.forEach(function(row, index){
      drawArrangeLabel(context, arrangeRowText(figure, index), rowLabelWidth - 18,
        titleHeight + colLabelHeight + index * cellSize + cellSize / 2,
        rowLabelWidth - 32, "right");
    });
    context.strokeStyle = arrangeCss("--line-strong");
    context.lineWidth = 1;
    cells.forEach(function(item){
      var x = rowLabelWidth + item.col * cellSize;
      var y = titleHeight + colLabelHeight + item.row * cellSize;
      context.fillStyle = arrangeCss("--stage-bg");
      context.fillRect(x, y, cellSize, cellSize);
      if (item.cell) context.drawImage(item.canvas, x, y);
      context.strokeRect(x + .5, y + .5, cellSize - 1, cellSize - 1);
      // The same number the screen shows. A preview that drops it would be answering a
      // different question from the one the reader was looking at when they pressed the button.
      if (item.cell && arrangeShowValues) {
        var measured = arrangeCoreValue(item.cell.core, figure);
        if (measured != null) {
          context.save();
          context.font = "700 15px " + face;
          context.fillStyle = "rgba(0,0,0,.55)";
          var text = String(Math.round(measured));
          var pad = 6, wide = context.measureText(text).width + pad * 2;
          context.fillRect(x + cellSize - wide - 8, y + cellSize - 30, wide, 22);
          context.fillStyle = "#ffffff";
          context.textAlign = "right";
          context.textBaseline = "middle";
          context.fillText(text, x + cellSize - 8 - pad, y + cellSize - 19);
          context.restore();
        }
      }
    });
    return canvas;
  });
}
function exportArrangementPng(){

/* ------------------------------------------------------------------ export */
var EXPORT_FILTERS = [
  {key:"all",     labelKey:"filterAll",     test:function(){ return true; }},
  {key:"ok",      labelKey:"filterPassed",  test:function(c){ return coreClassOf(c) === "ok"; }},
  {key:"review",  labelKey:"filterReview",  test:function(c){ return coreClassOf(c) === "review"; }},
  {key:"error",   labelKey:"filterError",   test:function(c){ return coreClassOf(c) === "error"; }},
  {key:"missing", labelKey:"filterMissing", test:function(c){ return coreClassOf(c) === "missing"; }}
];
var exportFilter = "all", exportVisible = [], exportDialogIndex = 0;
var exportDrawnModel = null, exportProject = "", exportGroups = [];
var exportGroupsDetailed = false, exportTableLoad = "idle", exportTableError = "";
var exportDialogSource = null;

function projectUrl(path){
  return "/project/" + String(path || "").split("/").map(encodeURIComponent).join("/");
}
function degreeText(value){
  if (value == null || value === "" || !Number.isFinite(Number(value))) return "–";
  return Number(value).toFixed(1) + "°";
}
function confidenceText(value){
  if (value == null || value === "" || !Number.isFinite(Number(value))) return "–";
  return Math.round(Number(value) * 100) + "%";
}
function exportFilterTest(key){
  for (var i = 0; i < EXPORT_FILTERS.length; i++) {
    if (EXPORT_FILTERS[i].key === key) return EXPORT_FILTERS[i].test;
  }
  return EXPORT_FILTERS[0].test;
}
function exportStatusWord(kind){
  if (kind === "review") return t("filterReview");
  if (kind === "error") return t("filterError");
  if (kind === "missing") return t("filterMissing");
  return t("filterPassed");
}
function drawExportChips(){
  var box = $("exportChips");
  box.textContent = "";
  EXPORT_FILTERS.forEach(function(item){
    var button = document.createElement("button");
    button.type = "button";
    button.className = "chip";
    button.setAttribute("aria-pressed", String(exportFilter === item.key));
    button.appendChild(document.createTextNode(t(item.labelKey)));
    var count = document.createElement("span");
    count.className = "n";
    count.textContent = (model.cores || []).filter(item.test).length;
    button.appendChild(count);
    button.addEventListener("click", function(){
      exportFilter = item.key;
      if ($("exportDialog").open) $("exportDialog").close();
      drawExportChips();
      drawExportGallery();
    });
    box.appendChild(button);
  });
}
function drawExportGallery(){
  exportVisible = (model.cores || []).filter(exportFilterTest(exportFilter));
  var gallery = $("exportGallery");
  gallery.textContent = "";
  exportVisible.forEach(function(core, index){
    var tile = document.createElement("button");
    tile.type = "button";
    tile.className = "resultTile";
    tile.setAttribute("aria-label", t("openCoreDetails", core.core));
    if (core.rotated) {
      var image = document.createElement("img");
      image.className = "resultThumb";
      image.src = projectUrl(core.rotated);
      image.alt = core.core;
      image.loading = "lazy";
      image.decoding = "async";
      // A gallery of 126 previews at ~300 KB each will happily saturate the link and leave
      // the detail view, which is the thing the person actually asked for, waiting behind it.
      image.setAttribute("fetchpriority", "low");
      image.width = 900;
      image.height = 900;
      tile.appendChild(image);
    } else {
      var placeholder = document.createElement("span");
      placeholder.className = "resultPlaceholder";
      placeholder.textContent = t("noPreview");
      tile.appendChild(placeholder);
    }
    var meta = document.createElement("span");
    meta.className = "resultTileMeta";
    var name = document.createElement("span");
    name.className = "resultTileName";
    name.textContent = core.core + " · " + degreeText(core.rotateToTopDeg);
    meta.appendChild(name);
    // Every tile states its status, including the ones that passed. A blank line under the
    // good cores makes the reader infer meaning from an absence, and it leaves the gallery
    // with a ragged edge that reads as broken.
    var kind = coreClassOf(core);
    var state = document.createElement("span");
    state.className = "resultState";
    state.innerHTML = '<i class="sDot" data-s="' + kind + '"></i>';
    state.appendChild(document.createTextNode(exportStatusWord(kind)));
    meta.appendChild(state);
    tile.appendChild(meta);
    tile.addEventListener("click", function(){ openExportDialog(index, tile); });
    gallery.appendChild(tile);
  });

}
function setResultImage(imageId, placeholderId, path, name){
  var image = $(imageId), placeholder = $(placeholderId);
  image.alt = name;
  if (path) {
    image.src = projectUrl(path);
    image.hidden = false;
    placeholder.hidden = true;
  } else {
    image.removeAttribute("src");
    image.hidden = true;
    placeholder.hidden = false;

function coreFullResolutionPath(core){
  var basename = String(core.rotated || "").split("/").pop();
  if (!basename) return "";
  var pngGroup = null;
  for (var i = 0; i < exportGroups.length; i++) {
    if (exportGroups[i].key === "png") { pngGroup = exportGroups[i]; break; }
  }
  if (!pngGroup) return "";
  if (Array.isArray(pngGroup.files)) {
    for (var j = 0; j < pngGroup.files.length; j++) {
      var file = pngGroup.files[j];
      if (String(file.name || "").split("/").pop() === basename) return file.path;
    }
    return "";
  }
  return exportGroupsDetailed ? "" : "results/png/" + basename;
}

}
function resetResultTable(){
  exportTableLoad = "idle";
  exportTableError = "";
  $("resultTableSection").open = false;
  $("resultTableState").hidden = false;
  $("resultTableState").textContent = t("openResultTable");
  $("resultTableWrap").hidden = true;
  $("resultTable").textContent = "";
}
function parseCSV(text){
  var rows = [], row = [], field = "", quoted = false;
  text = String(text || "");
  for (var i = 0; i < text.length; i++) {
    var character = text[i];
    if (quoted) {
      if (character === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (character === '"') quoted = false;
      else field += character;
    } else if (character === '"' && field === "") {
      quoted = true;
    } else if (character === ",") {
      row.push(field); field = "";
    } else if (character === "\r" || character === "\n") {
      if (character === "\r" && text[i + 1] === "\n") i++;
      row.push(field); rows.push(row); row = []; field = "";
    } else {
      field += character;
    }
  }
  if (field !== "" || row.length || text.endsWith(",")) { row.push(field); rows.push(row); }
  if (rows.length && rows[0].length) rows[0][0] = rows[0][0].replace(/^\uFEFF/, "");
  return rows;
}
function renderResultTable(rows){
  var table = $("resultTable");
  table.textContent = "";
  var width = rows.reduce(function(maximum, row){ return Math.max(maximum, row.length); }, 0);
  var head = document.createElement("thead"), headRow = document.createElement("tr");
  for (var column = 0; column < width; column++) {
    var heading = document.createElement("th");
    heading.scope = "col";
    heading.textContent = rows[0][column] || t("column", column + 1);
    headRow.appendChild(heading);
  }
  head.appendChild(headRow); table.appendChild(head);
  var body = document.createElement("tbody");
  rows.slice(1).forEach(function(row){
    var tr = document.createElement("tr");
    for (var column = 0; column < width; column++) {
      var cell = document.createElement("td");
      cell.textContent = row[column] === "" || row[column] == null ? "–" : row[column];
      tr.appendChild(cell);
    }
    body.appendChild(tr);
  });
  table.appendChild(body);
}
function loadResultTable(){
  if (exportTableLoad !== "idle") return;
  exportTableLoad = "loading";
  $("resultTableState").hidden = false;
  $("resultTableState").textContent = t("loadingResultTable");
  fetch("/api/download?path=" + encodeURIComponent("results/tables/orientation_results.csv"),
    {cache:"no-store"})
  .then(function(response){
    if (!response.ok) throw new Error(String(response.status));
    return response.text();
  })
  .then(function(text){
    var rows = parseCSV(text);
    if (!rows.length) throw new Error("empty");
    renderResultTable(rows);
    exportTableLoad = "loaded";
    $("resultTableState").hidden = true;
    $("resultTableWrap").hidden = false;
  })
  .catch(function(error){
    exportTableLoad = "failed";
    exportTableError = error.message;
    $("resultTableWrap").hidden = true;
    $("resultTableState").hidden = false;
    $("resultTableState").textContent = error.message === "404"
      ? t("resultTableMissing")
      : t("resultTableFailed");
  });
}
function drawDownloadGroups(groups){
  var list = $("groupList");
  list.textContent = "";
  (groups || []).forEach(function(group){
    var el = document.createElement("div");
    el.className = "group";
    el.innerHTML = '<div class="txt"><b></b><span></span></div><span class="cnt"></span>' +
      '<button class="btn"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true">' +
      '<path d="M13 10h5l-6 6-6-6h5V3h2v7zm-9 9h16v-7h2v8a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-8h2v7z"/></svg> zip</button>';
    var groupName = String(group.key || "").replace(/-([a-z])/g, function(_, letter){
      return letter.toUpperCase();
    });
    groupName = groupName.charAt(0).toUpperCase() + groupName.slice(1);
    el.querySelector("b").textContent = t("group" + groupName + "Title");
    el.querySelector(".txt span").textContent = t("group" + groupName + "Note");
    el.querySelector(".cnt").textContent = t("fileCount", group.count, group.size || "");
    el.querySelector("button").addEventListener("click", function(){
      window.location.href = "/api/download-zip?group=" + encodeURIComponent(group.key);
    });
    list.appendChild(el);
  });
  if (!(groups || []).length) {
    var note = document.createElement("p");
    note.className = "emptyNote";
    note.textContent = t("noResultFiles");
    list.appendChild(note);
  }
}
function drawExport(status){
  $("exportPath").textContent = status.project || "";
  var counts = model && model.counts ? model.counts : null;
  $("exportStrip").innerHTML = counts
    ? metric(counts.positions || 0, t("metricAllPositions"), "") +
      metric(counts.ok || 0, t("metricAutoPassed"), "ok") +
      metric(counts.review || 0, t("metricFlagged"), "warn") +
      metric(counts.missing || 0, t("metricNoTissue"), "none")
    : "";
  var projectChanged = exportProject !== (status.project || "");
  if (projectChanged) {
    exportProject = status.project || "";
    exportGroups = status.results || [];
    exportGroupsDetailed = false;
    exportFilter = "all";
    exportDrawnModel = null;
    $("downloadSection").open = false;
    resetResultTable();
    loadDetailedExportGroups(exportProject);
  } else if (!exportGroupsDetailed) {
    exportGroups = status.results || [];
  }
  drawDownloadGroups(status.results || []);

  var available = !!(model && model.available);
  $("exportUnavailable").hidden = available;
  $("exportReport").hidden = !available;
  $("resultTableSection").hidden = !available;
  if (!available) {
    if ($("exportDialog").open) $("exportDialog").close();
    return;
  }
  if (exportDrawnModel !== model) {
    exportDrawnModel = model;
    exportFilter = "all";
    drawExportChips();
    drawExportGallery();
  }
}
$("zipAll").addEventListener("click", function(){
  window.location.href = "/api/download-zip?group=all";
});
$("resultTableSection").addEventListener("toggle", function(){
  if (this.open) loadResultTable();
});
$("closeExportDialog").addEventListener("click", function(){ $("exportDialog").close(); });
$("exportPrev").addEventListener("click", function(){ moveExportDialog(-1); });
$("exportNext").addEventListener("click", function(){ moveExportDialog(1); });
$("exportDialog").addEventListener("click", function(event){
  if (event.target === this) this.close();
});
$("exportDialog").addEventListener("close", function(){
  if (stage === "export" && exportDialogSource && exportDialogSource.isConnected)
    exportDialogSource.focus();
});
document.addEventListener("keydown", function(event){
  if (stage !== "export" || !$("exportDialog").open) return;
  if (event.key === "ArrowLeft") { event.preventDefault(); moveExportDialog(-1); }
  if (event.key === "ArrowRight") { event.preventDefault(); moveExportDialog(1); }
  if (event.key === "Escape") { event.preventDefault(); $("exportDialog").close(); }
});

/* ------------------------------------------------------------------ log drawer */
$("logToggle").addEventListener("click", function(){
  var drawer = $("logDrawer");
  var open = drawer.dataset.open !== "true";
  drawer.dataset.open = String(open);
  this.setAttribute("aria-expanded", String(open));
  if (open) refreshLog();
});
function refreshLog(){
  api("/api/log").then(function(res){
    var text = (res.body && res.body.log) || "";
    var pre = $("logText");
    if (pre.textContent === text) return;
    pre.textContent = text;
    var body = pre.parentElement;
    body.scrollTop = body.scrollHeight;
  });
}

/* ------------------------------------------------------------------ polling */
var STATE_TEXT = {
  idle:      ["stateIdle", "idle"],
  starting:  ["stateStarting", "run"],
  running:   ["stateRunning", "run"],
  complete:  ["stateComplete", "ok"],
  stopped:   ["stateStopped", "wait"],
  cancelled: ["stateCancelled", "wait"],
  failed:    ["stateFailed", "bad"]
};
var lastLogLine = "", lastLogLanguage = "", lastLogText = "";
var lastGateId = "", runState = "idle", lastStatus = null;

function poll(){
  api("/api/status").then(function(res){
    if (res.ok) paintStatus(res.body);
  });
}
function paintStatus(status){
  lastStatus = status;
  runState = status.state || "idle";
  var gate = status.gate;
  var waiting = !!(gate && gate.gate);
  var text = STATE_TEXT[status.state] || ["", "idle"];
  $("stateText").textContent = waiting ? t("waitingDecision") : t(text[0]);
  $("statePill").dataset.tone = waiting ? "wait" : text[1];

  var clock = $("clock");
  clock.hidden = !status.elapsedSeconds;
  if (status.elapsedSeconds) {
    var m = Math.floor(status.elapsedSeconds / 60), s = status.elapsedSeconds % 60;
    clock.textContent = m + ":" + (s < 10 ? "0" : "") + s;
  }
  if (status.slide) {
    var name = status.slide.split("/").pop();
    $("slideName").textContent = name;
    if (!chosenSlide) chosenSlide = {name:name, path:status.slide};
  }
  if (status.project && (status.project !== arrangeProject ||
      (!arrangeAvailable && Date.now() - arrangeLastCheck > 5000)))
    loadArrange(status.project);
  paintProgress();
  showAbandoned(status);

  openGate = waiting ? gate : null;
  var gateId = waiting ? gate.gate : "";
  var gateChanged = gateId !== lastGateId;
  lastGateId = gateId;

  // Fetch the review model only when something new could be in it: a gate opened or
  // closed, or the run reached a resting state. Never on every tick, so the list is not
  // re-rendered under the cursor.
  var needModel = gateChanged || (!model && status.hasResults) ||
    (!model && (status.state === "complete" || status.state === "stopped"));
  if (!needModel) { route(status, gateId); return; }
  api("/api/review").then(function(res){
    var next = res.body || {};
    var fresh = !model || next.baseRun !== reviewKey;
    model = next;
    if (model.available) { reviewKey = model.baseRun; drawReview(fresh); }
    if (model.grid) drawGrid();
    showPriorRun();
    route(status, gateId);
  });
}
var GATE_WORDS = {grid:"abandonedGrid", orientation:"abandonedOrientation"};

function showAbandoned(status){
  // A gate.json from a run that has since died. CoreAlign removes that file when it
  // finishes or is stopped politely, but not when the job is cancelled or killed. Saying
  // so is better than showing a question whose loopback port is already gone.
  var left = status.abandonedGate;
  var banner = $("abandonedRun");
  if (!left || !left.gate) { banner.hidden = true; return; }
  var when = String(left.openedAt || "").replace("T", " ").replace(/(Z|\+.*)$/, "");
  var gateWords = t(GATE_WORDS[left.gate] || "abandonedWaiting");
  $("abandonedNote").textContent = when
    ? t("abandonedAt", gateWords, when)
    : t("abandonedNoTime", gateWords);
  banner.hidden = false;
}

function showPriorRun(){
  var banner = $("priorRun");
  if (!model || !model.available) { banner.hidden = true; return; }
  // Results already exist here, so the review and results stages are worth opening even
  // though nothing is running. Reaching them is the whole point of attaching.
  reached.review = true; reached.export = true; paintStages();
  var counts = model.counts || {};
  $("priorRunNote").textContent = t("priorCounts", counts.positions || 0, counts.ok || 0,
    counts.review || 0, counts.missing || 0);
  banner.hidden = false;
}
// CoreAlign logs in English because the log is also the audit trail. The run screen is
// read by people mid-task, so use the page language and leave anything unrecognised alone.
var STEP_WORDS = [
  [/Running 01_build_tma_grid/,        "stepBuildGrid"],
  [/Running 02_auto_orient/,           "stepOrient"],
  [/Running 03_review_correct/,        "stepApplyGrid"],
  [/Running 04_restore_approved_grid/, "stepRestoreGrid"],
  [/Running 05_finalize/,              "stepFinalize"],
  [/Running 06_export/,                "stepExport"],
  [/Running 07_build_qupath/,          "stepQupath"],
  [/Orientation workers: (\d+)/,       "stepWorkers"],
  [/Orientation progress: (\d+)\/(\d+)/, "stepProgress"],
  [/Estimating core size/,             "stepEstimate"],
  [/Detecting TMA cores/,              "stepDetect"],
  [/Published (\d+)/,                  "stepPublished"],
  [/WAITING FOR REVIEW/,               "stepWaitingReview"],
  [/COREALIGN_GATE_OPEN: grid/,        "stepWaitingGrid"],
  [/COREALIGN_GATE_OPEN: orientation/, "stepWaitingOrientation"],
  [/COREALIGN_GATE_CLOSED/,            "stepGateClosed"],
  [/Channel subset: keeping (\d+) of (\d+)/, "stepChannelSubset"],
  [/Channels kept \(\d+\): \[(.+)\]/,   "stepChannelsKept"],
  [/Pipeline stopped safely/,          "stepStopped"],
  [/CoreAlign COMPLETE/,               "stepComplete"]
];
function stepWords(line){
  for (var i = 0; i < STEP_WORDS.length; i++) {
    var found = STEP_WORDS[i][0].exec(line);
    if (found) {
      return t(STEP_WORDS[i][1]).replace(/\$(\d)/g, function(_, n){
        return found[Number(n)] || "";
      });
    }
  }
  return line;
}

function paintProgress(){
  api("/api/log").then(function(res){
    var log = (res.body && res.body.log) || "";
    renderProgress(log);
  });
}
function renderProgress(log){
    lastLogText = log;
    var lines = log.replace(/\s+$/, "").split("\n");
    var tail = lines[lines.length - 1] || "";
    if (tail === lastLogLine && lang === lastLogLanguage) return;
    lastLogLine = tail;
    lastLogLanguage = lang;
    // The drawer holds the raw log on purpose. The one line peeking out of it sits at the
    // bottom of every screen, though, so it gets the same treatment as the run step.
    $("logTail").textContent = tail ? stepWords(tail) : "";
    $("runStep").textContent = tail ? stepWords(tail).slice(0, 140) : t("working");
    // The last few things that happened, so a long step does not look like a hang.
    var recent = lines.filter(function(line){
      return /Running \d\d_|Orientation workers|Orientation progress|Estimating core size|Detecting TMA cores|Published \d+|WAITING FOR REVIEW|GATE_CLOSED|Pipeline stopped safely|CoreAlign COMPLETE/.test(line);
    }).slice(-5);
    var activity = $("activity");
    activity.textContent = "";
    recent.forEach(function(line){
      var li = document.createElement("li");
      li.textContent = stepWords(line.trim());
      activity.appendChild(li);
    });
    // The tail holds several progress lines. Take the last, not the first one the scan
    // happens to reach, or the bar sits at the oldest reading in the window.
    var found = log.slice(-6000).match(/Orientation progress: \d+\/\d+/g);
    var match = found ? /Orientation progress: (\d+)\/(\d+)/.exec(found[found.length - 1]) : null;
    var bar = $("runBar");
    if (match) {
      bar.classList.remove("indeterminate");
      bar.firstElementChild.style.width = (100 * Number(match[1]) / Number(match[2])) + "%";
      $("runCounts").hidden = false;
      $("runCounts").innerHTML =
        "<div><b>" + match[1] + "</b><span>" + t("done") + "</span></div>" +
        "<div><b>" + match[2] + "</b><span>" + t("total") + "</span></div>";
    } else {
      bar.classList.add("indeterminate");
      bar.firstElementChild.style.width = "100%";
      $("runCounts").hidden = true;
    }
    if ($("logDrawer").dataset.open === "true") refreshLog();
}
function route(status, gateId){
  if (gateId === "grid") {
    reached.review = true;
    if (stage !== "grid") setStage("grid");
    drawActionBar();
    return;
  }
  if (gateId === "orientation") {
    reached.review = true;
    if (stage !== "review") setStage("review");
    drawActionBar();
    return;
  }
  if (status.state === "running" || status.state === "starting") {
    if (stage !== "run") setStage("run");
    $("actionBar").hidden = true;
    return;
  }
  if (status.state === "complete") {
    reached.review = true; reached.export = true;
    if (stage !== "export" && stage !== "review" && stage !== "arrange") setStage("export");
    $("exportTitle").textContent = t("resultsReady");
    drawExport(status);
    drawActionBar();
    return;
  }
  if (status.state === "stopped" || status.state === "failed" || status.state === "cancelled") {
    reached.export = true;
    if (model && model.available) {
      reached.review = true;
      // Results exist and nobody has approved them yet: the review screen is the useful one.
      if (stage !== "review" && stage !== "export" && stage !== "grid" && stage !== "arrange")
        setStage("review");
    }
    if (stage === "export") { $("exportTitle").textContent = t("resultsCurrent"); drawExport(status); }
    drawActionBar();
    return;
  }
  // Idle, but a folder with results can be attached: keep the bar on the review stage.
  if (stage === "export") drawExport(status);
  drawActionBar();
}

// The overlay is positioned against the image's rendered box, which moves with the window,
// the log drawer and the zoom toggle. Redraw whenever it actually changes.
if (window.ResizeObserver) {
  // Watch the stage, not the image: the image's size is set by fitGridCanvas, so observing
  // it would just re-trigger on its own writes.
  new ResizeObserver(function(){ drawGridOverlay(); }).observe($("gridStage"));
}
window.addEventListener("resize", function(){ drawGridOverlay(); });

function renderLanguage(){
  document.documentElement.lang = lang;
  applyStaticTranslations();
  buildStages();
  paintStages();
  if (browseData) drawBrowse(browseData);
  if (chosenSlide) $("slideName").textContent = chosenSlide.name;

  var roleKeys = {nuclear:"roleNuclear", autofluorescence:"roleAutofluorescence", marker:"roleMarker"};
  $("channelList").querySelectorAll(".role").forEach(function(role){
    role.textContent = t(roleKeys[role.dataset.kind] || roleKeys.marker);
  });
  if ($("channelList").querySelectorAll("input").length) paintChannelSummary();
  $("channelToggleWord").textContent = $("channelPanel").hidden ? t("change") : t("close");
  $("zoomToggle").textContent = $("gridStage").dataset.zoom === "true" ? t("zoomFit") : t("zoomFull");

  if (lastStatus) {
    var waiting = !!(lastStatus.gate && lastStatus.gate.gate);
    var stateWords = STATE_TEXT[lastStatus.state] || ["stateIdle", "idle"];
    $("stateText").textContent = waiting ? t("waitingDecision") : t(stateWords[0]);
    showAbandoned(lastStatus);
  }
  if (model && model.available) {
    drawReview(false);
    showPriorRun();
  }
  if (model && model.grid) {
    drawGrid();
    if (pickedCore) pickCore(pickedCore);
  }
  if (lastStatus && stage === "export") {
    $("exportTitle").textContent = lastStatus.state === "complete"
      ? t("resultsReady") : t("resultsCurrent");
    drawExport(lastStatus);
  }
  if (arrangeAvailable) drawArrange();
  if (exportTableLoad === "loading") $("resultTableState").textContent = t("loadingResultTable");
  if (exportTableLoad === "failed") $("resultTableState").textContent = exportTableError === "404"
    ? t("resultTableMissing") : t("resultTableFailed");
  if ($("exportDialog").open) drawExportDialog();
  renderProgress(lastLogText);
  drawActionBar();
}

/* ------------------------------------------------------------------ start */
renderLanguage();
setStage("slide");
browse("");
poll();
setInterval(poll, 2000);
</script>
